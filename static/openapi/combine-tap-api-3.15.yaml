  /tap/api/v3/users/{userId}/resend:
    post:
      tags:
        - Users
      summary: Resend the certificate email
      description: "Resends the welcome email for the user's certificate bundle. Requires
        the admin role and email integration. The email is sent whether or not the
        sendWelcomeEmail setting is on; it includes a download link valid for 12 hours by
        default when the showBundleLinks setting is on, and attaches the bundle when the
        sendWelcomeEmailWithAttachment setting is on."
      operationId: resendCertificate
      security:
        - mutualTLS: []
          xRequestedBy: []
      parameters:
        - name: userId
          in: path
