openapi: 3.1.0
info:
  title: Combine TAP API
  description: |-
    The Combine TAP API manages users, servers, groups, AWS role assignments, certificates, alert events, configuration, metadata, and operational tools for a Combine deployment. The CAP- and SCAP-compatible endpoints that issue temporary AWS credentials are documented separately in the [CAP / SCAP API](/cap-scap-api/cap-scap-api) section.

    All requests must use HTTPS, except the health check and the OCSP responder, which are also served over HTTP. Except where explicitly noted, requests require mutual TLS with a valid client certificate issued for the deployment. There is no login step: the certificate's serial number identifies the caller's user account, and that account's role (user, admin, or super_admin) determines what the caller can access. Each authenticated request sets the account's `lastConsoleLoginDate` to the current UTC date (YYYY-MM-DD).

    A request that fails authentication receives an `ErrorResponse` (`{"success": false, "message": "..."}`) instead of reaching the endpoint: 400 over plain HTTP ("This Request is not supported over an HTTP connection. Please retry over an HTTPS connection."), 401 without a client certificate ("This Request does not have a valid Client Certificate.") or with a revoked certificate ("This Request has a Client Certificate that is revoked."), and 403 for an unknown account ("This User Account is not recognized.", also returned when the account cannot be read) or an inactive account ("This User Account is not active."). A request that looks like a browser navigation, because it sends `Sec-Fetch-Mode: navigate` or an `Accept` header that contains `text/html`, receives the same status with the Combine HTML error page instead. An unexpected failure during authentication returns the Combine HTML error page with status 200.

    This reference documents every endpoint at version `v3` (`/tap/api/v3`). Versions `v1` and `v2` are DEPRECATED and will be removed in a future version of Combine. Every endpoint documented at `/tap/api/v3` also answers, identically, at the `/tap/api/v1` and `/tap/api/v2` prefixes, except the Users and Servers entity operations, which differ by version and are documented separately as deprecated operations: in `v1`, the list endpoints return every user or server in full and `bundlePath` is a presigned download link; in `v1` and `v2`, `awsRoles` is returned as a list of AWS Role objects and accepted as a list of AWS Role objects or AWS Role ids; in `v3`, `awsRoles` is returned and accepted only as a list of AWS Role ids. The OCSP responder and the AWS console login keep their fixed `/tap/api/v1` paths, and the health check is at `/combine/api/health`. A request to any other version segment, such as `/tap/api/v4`, matches no endpoint and is answered like any other unknown path, as described below.

    Responses of at least 1,024 bytes, or of unknown length, with a content type of `application/json`, `text/plain`, `text/html`, `text/css`, or `application/javascript` are compressed with gzip when the request's `Accept-Encoding` header accepts gzip. Compression is set in the TAP server's HTTP and HTTPS connectors and is not controlled by a Configuration Value.

    Requests that modify data must include the X-Requested-By header, with any value; this applies to every method except GET and HEAD, on every path except the health check and the OCSP responder. The header is checked before authentication. A request that omits it is rejected with 400 and an `ErrorResponse` with the message "This request could not be verified." (the Combine HTML error page for a browser navigation). Administrative operations require an account with the admin role, and some require the super_admin role; the super_admin role satisfies every role check. A caller without the required role receives 403 with an `ErrorResponse`.

    A request to a path that no endpoint serves, and a 404 that an operation returns without a body, receive 404 with `{"success": false, "message": "Not Found"}`; a PUT, PATCH, or DELETE request to a path that no endpoint serves receives 405 with `{"success": false, "message": "An unexpected error occurred."}` instead. Any other error status that an operation returns without a body, including 405 for an unsupported method, 406 for an `Accept` header that excludes every content type the operation returns, 415 for an unsupported `Content-Type`, and 500 for an unhandled server error, receives `{"success": false, "message": "An unexpected error occurred."}` with that status. A browser navigation receives the Combine HTML error page instead of either body.

    When the combine.tap.application.cors.enable Configuration Value is true (default false), every response carries the `Access-Control-Allow-Origin`, `Access-Control-Allow-Methods`, `Access-Control-Allow-Headers`, `Access-Control-Allow-Credentials`, and `Referrer-Policy` headers set by the combine.tap.application.cors.* Configuration Values, and every OPTIONS request is answered with 200 and an empty body before the X-Requested-By and authentication checks.

    For a step-by-step guide with curl and Python examples, see [Call the TAP API](/Combine-AWS/tutorials/development/how-to-call-the-tap-api).
  version: "3.15.1.1"
servers:
  - url: "https://{host}"
    description: Base URL for a shard's TAP API.
    variables:
      host:
        description: External TAP load balancer DNS name for the shard.
        default: tap.example.com
security:
  - mutualTLS: []
tags:
  - name: Users
    description: Manage user accounts and their credential bundles.
  - name: Servers
    description: Manage server accounts and their certificates.
  - name: Groups
    description: Manage groups and their memberships.
  - name: AWS Roles
    description: Manage the AWS roles available for assignment.
  - name: AWS Console
    description: Sign in to the AWS console with an assigned AWS role.
  - name: Certificates
    description: Sign certificates and check certificate status.
  - name: Alert Events
    description: View and manage security alert events.
  - name: Configuration
    description: View and update the application configuration.
  - name: Administration
    description: Administrative operations such as sending mass email and rebuilding
      credential bundles.
  - name: Metadata
    description: "Application metadata, reference data, and deployment information."
  - name: Documentation
    description: "Reference lookups for the emulated partition: its regions, supported
      instance types, versions, models, endpoints, and service principals, and the
      trust policy for a self-managed IAM role."
  - name: Tools
    description: "Utilities such as CloudFormation template analysis, workload health,
      firewall rules, Logs Insights queries, and IAM user credential registration."
  - name: System
    description: Service health checks.
paths:
  /tap/api/v3/alerts/events:
    get:
      tags:
        - Alert Events
      summary: List alert events
      description: "Returns alert events, most recently seen first, optionally filtered
        by date range, User Group, and ignored state. Available to any authenticated
        user. Any other query parameter is ignored, including the summary parameter
        of earlier releases."
      operationId: getAlertEvents
      parameters:
        - name: dateStart
          in: query
          description: "Inclusive lower bound on the time the event was last seen, in
            epoch seconds. Compared as a string, so send the same number of digits as
            stored timestamps (10 for current dates)."
          schema:
            type: string
            default: ""
        - name: dateEnd
          in: query
          description: "Inclusive upper bound on the time the event was last seen, in
            epoch seconds. Compared as a string, like dateStart."
          schema:
            type: string
            default: ""
        - name: showIgnored
          in: query
          description: "When \"true\" (ignoring case and surrounding whitespace), include
            ignored events; otherwise only open events are returned."
          schema:
            type: string
            default: ""
        - name: groupId
          in: query
          description: "Identifier of a User Group. When set, only events that match
            the group are returned: if the group has cidrBlocks, the event's sourceIp
            field (or its requestHost field, when that is an IP address) must fall in
            one of them, IPv4 only, so an IPv6 address or block never matches; if the
            group has accountIds, the event's accountId field must
            equal one of them. A group with neither returns an empty list. vpcIds is
            not used. Any group may be named; the caller does not need to be a member."
          schema:
            type: string
            default: ""
      responses:
        "200":
          description: Matching alert events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertEventListResponse"
        "404":
          description: No User Group exists with the given groupId.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "dateStart and dateEnd are both set and dateStart sorts after
            dateEnd as a string, so DynamoDB rejects the range. The generic error body
            (message \"An unexpected error occurred.\") is returned, or the Combine HTML
            error page when the request prefers HTML."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            text/html:
              schema:
                type: string
    delete:
      tags:
        - Alert Events
      summary: Delete all alert events
      description: "Permanently deletes every alert event. An event that still cannot
        be deleted after five attempts is left in place, and the response is still
        200. Requires the super_admin role."
      operationId: deleteAlertEvents
      security:
        - mutualTLS: []
          xRequestedBy: []
      responses:
        "200":
          description: All alert events were deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "403":
          description: The caller does not have the super_admin role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The alert events could not be deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tap/api/v3/alerts/events/export:
    get:
      tags:
        - Alert Events
      summary: Export all alert events
      description: "Returns every alert event, open and ignored, as a downloadable
        JSON attachment (a bare array, not wrapped in data). Available to any authenticated
        user."
      operationId: exportAlertEvents
      responses:
        "200":
          description: JSON attachment containing all alert events.
          headers:
            Content-Disposition:
              description: Always attachment; filename="events.json".
              style: simple
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AlertEvent"
  /tap/api/v3/alerts/events/{id}:
    get:
      tags:
        - Alert Events
      summary: Get an alert event
      description: Returns a single alert event by its identifier. Available to any
        authenticated user.
      operationId: getAlertEvent
      parameters:
        - name: id
          in: path
          description: Identifier of the alert event.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The requested alert event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertEventResponse"
        "404":
          description: No alert event exists with the given identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The alert event could not be retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
        - Alert Events
      summary: Reopen an alert event
      description: Sets the state of the given alert event to "open". Available to
        any authenticated user.
      operationId: openAlertEvent
      security:
        - mutualTLS: []
          xRequestedBy: []
      parameters:
        - name: id
          in: path
          description: Identifier of the alert event.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The alert event was reopened.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          description: No alert event exists with the given identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The alert event could not be reopened.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
        - Alert Events
      summary: Ignore an alert event
      description: Sets the state of the given alert event to "ignored". Available
        to any authenticated user.
      operationId: ignoreAlertEvent
      security:
        - mutualTLS: []
          xRequestedBy: []
      parameters:
        - name: id
          in: path
          description: Identifier of the alert event.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The alert event was ignored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          description: No alert event exists with the given identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The alert event could not be ignored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tap/api/v1/login:
    get:
      tags:
        - AWS Console
      summary: Log in to the AWS console
      description: "Redirects to an AWS console federated sign-in URL for the assumed
        role. Authenticated with a client certificate. The caller may sign in only
        with roles assigned to them. Served only at /tap/api/v1/login. The console
        session lasts the combine.tap.users.session.dashboard.duration.default Configuration
        Value (default 3600 seconds), reduced to 3600 when the User Management Account
        is reached by assuming a role."
      operationId: login
      parameters:
        - name: environment
          in: query
          description: "Identifier of the cloud partition the role belongs to, such\
            \ as AWS_C2S, AWS_SC2S, or AWS_GOV_CLOUD."
          required: true
          schema:
            type: string
        - name: agency
          in: query
          description: "Agency name of the AWS role (its agency valueAlias). Matched
            exactly (case-sensitive)."
          required: true
          schema:
            type: string
        - name: account
          in: query
          description: "Account (mission) name of the AWS role (its account valueAlias),
            not the account number. Matched exactly (case-sensitive)."
          required: true
          schema:
            type: string
        - name: role
          in: query
          description: "Role name of the AWS role (its role valueAlias). The IAM role
            that is assumed is the role value, which can differ. Matched exactly (case-sensitive)."
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "The sign-in could not be completed: a parameter is missing,
            no AWS role matches, the role is not assigned to the caller, the role could
            not be assumed, or the AWS federation endpoint did not return a sign-in token.
            The Combine HTML error page is returned with status 200 and the message
            \"Could not sign in to the AWS Console. Please contact your Combine Administrator.\",
            whatever the request's Accept header."
          content:
            text/html:
              schema:
                type: string
        "307":
          description: Redirect to the AWS console federated sign-in URL.
          headers:
            Location:
              description: "AWS federated sign-in URL for the console of the Region
                Combine is deployed in."
              style: simple
              schema:
                type: string
                format: uri
  /tap/api/v1/login/credentials:
    get:
      tags:
        - AWS Console
      summary: Get AWS console login credentials
      description: "Returns temporary AWS credentials for the dashboard login flow.
        Authenticated with a client certificate. Credentials are issued only for roles
        assigned to the caller. Served only at /tap/api/v1/login/credentials. The
        credentials last the combine.tap.users.session.dashboard.duration.default Configuration
        Value (default 3600 seconds), reduced to 3600 when the User Management Account
        is reached by assuming a role."
      operationId: loginCredentials
      parameters:
        - name: environment
          in: query
          description: "Identifier of the cloud partition the role belongs to, such\
            \ as AWS_C2S, AWS_SC2S, or AWS_GOV_CLOUD."
          required: true
          schema:
            type: string
        - name: agency
          in: query
          description: "Agency name of the AWS role (its agency valueAlias). Matched
            exactly (case-sensitive)."
          required: true
          schema:
            type: string
        - name: account
          in: query
          description: "Account (mission) name of the AWS role (its account valueAlias),
            not the account number. Matched exactly (case-sensitive)."
          required: true
          schema:
            type: string
        - name: role
          in: query
          description: "Role name of the AWS role (its role valueAlias). The IAM role
            that is assumed is the role value, which can differ. Matched exactly (case-sensitive)."
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The temporary credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialsResponse"
        "500":
          description: "The credentials could not be issued: a parameter is missing,
            no AWS role matches, the role is not assigned to the caller, or the role
            could not be assumed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: An unexpected error occurred.
  /combine/api/health:
    get:
      tags:
        - System
      summary: Check service health
      description: Returns 200 with an empty body when the service is available. Does
        not require a client certificate, and is also served over HTTP.
      operationId: healthCheck
      security: []
      responses:
        "200":
          description: The service is available. The body is empty.
  /tap/api/v3/admin/bundle:
    post:
      tags:
        - Administration
      summary: Rebuild all credential bundles
      description: "Rebuilds the certificate bundle of every user, active or inactive,
        and every server from its stored certificate files and the current CA certificates.
        No certificate is reissued. A bundle that cannot be rebuilt is skipped, and
        the response is still 200. Requires the super_admin role."
      operationId: rebuildAllBundles
      security:
        - mutualTLS: []
          xRequestedBy: []
      responses:
        "200":
          description: The bundles were rebuilt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "403":
          description: The caller does not have the super_admin role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The bundles could not be rebuilt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tap/api/v3/admin/email:
    put:
      tags:
        - Administration
      summary: Send a mass email
      description: "Sends an email to the selected accounts as Bcc recipients, in batches
        of up to 32 recipients per message by default. Requires the super_admin role."
      operationId: sendMassEmail
      security:
        - mutualTLS: []
          xRequestedBy: []
      requestBody:
        description: The recipients and content of the email.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MassEmailRequest"
        required: true
      responses:
        "200":
          description: "The email was sent to all, or some, of the recipients. The\
            \ message reports how many were sent."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "403":
          description: The caller does not have the super_admin role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email integration is not enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "The email could not be sent to any recipient, or the request
            body is missing a field or is not valid JSON."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tap/api/v3/aws-roles:
    get:
      tags:
        - AWS Roles
      summary: List AWS roles
      description: Returns all AWS roles. Requires the admin role.
      operationId: all
      responses:
        "200":
          description: A list of AWS roles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AwsRoleListResponse"
        "403":
          description: The caller does not have the admin role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - AWS Roles
      summary: Create an AWS role
      description: Creates an AWS role. Requires the admin role.
      operationId: createRole
      security:
        - mutualTLS: []
          xRequestedBy: []
      requestBody:
        description: The role to create.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AwsRoleRequest"
        required: true
      responses:
        "200":
          description: The created AWS role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AwsRoleResponse"
        "400":
          description: "The environment is missing or is not an emulated AWS partition;
            the account, agency, or role is null or has a blank value or valueAlias;
            another role in the same environment has the same account valueAlias and
            role valueAlias (ignoring case); or the role could not be saved, including
            when the request body is malformed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller does not have the admin role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tap/api/v3/aws-roles/current:
    get:
      tags:
        - AWS Roles
      summary: List my AWS roles
      description: "Returns the AWS roles assigned to the authenticated caller, sorted
        by id from highest to lowest. An assigned id that no longer matches an AWS role
        is left out. Available to any authenticated user."
      operationId: getCurrentAwsRoles
      responses:
        "200":
          description: The caller's AWS roles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AwsRoleListResponse"
        "500":
          description: The AWS roles could not be read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tap/api/v3/aws-roles/{roleId}:
    get:
      tags:
        - AWS Roles
      summary: Get an AWS role
      description: Returns a single AWS role by its identifier. Requires the admin
        role.
      operationId: getRole
      parameters:
        - name: roleId
          in: path
          description: Identifier of the role.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The requested AWS role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AwsRoleResponse"
        "403":
          description: The caller does not have the admin role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "No role exists with the given identifier, or the identifier\
            \ is not a number."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
        - AWS Roles
      summary: Update an AWS role
      description: "Updates an AWS role. Users and servers hold an AWS role by its
        id, so they see the change. The environment, account, and role values
        must always be provided; an omitted agency is reset to Combine, and defaultRole
        is changed only when present. Each of account, agency, and role is replaced
        as a whole, so an omitted valueDescription becomes empty. An id in the request
        body is ignored. Requires the admin role."
      operationId: updateRole
      security:
        - mutualTLS: []
          xRequestedBy: []
      parameters:
        - name: roleId
          in: path
          description: Identifier of the role.
          required: true
          schema:
            type: string
      requestBody:
        description: The role values to apply.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AwsRoleRequest"
        required: true
      responses:
        "200":
          description: The updated AWS role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AwsRoleResponse"
        "400":
          description: "The environment is missing or is not an emulated AWS partition;
            the account, agency, or role is null or has a blank value or valueAlias;
            or another role in the same environment has the same account valueAlias
            and role valueAlias (ignoring case)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller does not have the admin role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "The role could not be updated, including when the identifier
            is not a number, no role exists with the given identifier, or the request
            body is malformed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
        - AWS Roles
      summary: Delete an AWS role
      description: Deletes an AWS role and removes its id from any users and servers
        that hold it. Requires the admin role.
      operationId: deleteRole
      security:
        - mutualTLS: []
          xRequestedBy: []
      parameters:
        - name: roleId
          in: path
          description: Identifier of the role.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The role was deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AwsRoleDeleteResponse"
        "403":
          description: The caller does not have the admin role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No role exists with the given identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "The identifier is not a number, the role could not be removed
            from its users and servers, or the role could not be deleted."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tap/api/v3/admin/certificate/custom:
    post:
      tags:
        - Certificates
      summary: Sign a custom certificate signing request
      description: "Signs a PEM-encoded PKCS#10 certificate signing request and returns
        the signed certificate. Requires the admin role. Requires custom CSR signing
        to be enabled (the combine.tap.api.certificates.signCustomCSR.enable Configuration
        Value, default false). The CSR's signature must verify against its own public
        key. The public key does not have to be RSA, and the CSR may omit its attributes
        field. The certificate is issued by the deployment's signer certificate authority
        and is valid for two years. It has the CSR's subject and public key, the DNS
        names from the CSR's subject alternative name extension, client and server
        authentication extended key usage, and an OCSP responder URL when the OCSP
        responder is enabled. Its serial number is a random number from 1,000,000 to
        1,999,999, which never identifies a TAP user account, so the certificate cannot
        be used to call the TAP API. Error responses are JSON."
      operationId: signCustomCsrRequest
      security:
        - mutualTLS: []
          xRequestedBy: []
      requestBody:
        description: The PEM-encoded PKCS#10 certificate signing request.
        content:
          text/plain:
            schema:
              type: string
              example: |-
                -----BEGIN CERTIFICATE REQUEST-----
                ...
                -----END CERTIFICATE REQUEST-----
        required: true
      responses:
        "200":
          description: The signed certificate in PEM format.
          content:
            text/plain:
              schema:
                type: string
                example: |-
                  -----BEGIN CERTIFICATE-----
                  ...
                  -----END CERTIFICATE-----
        "400":
          description: "The request body has no PEM object, its first PEM object is not
            a CERTIFICATE REQUEST or NEW CERTIFICATE REQUEST that can be parsed, or the
            CSR's signature does not verify against its own public key."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                notCsr:
                  value:
                    success: false
                    message: Request was not a PEM Encoded CSR!
                signatureInvalid:
                  value:
                    success: false
                    message: The CSR signature does not verify against its own Public
                      Key.
        "403":
          description: The caller does not have the admin role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: "User [123456] is not authorized to sign custom csr request!"
        "404":
          description: Custom CSR signing is not enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: API not enabled.
        "413":
          description: "The request body is longer than the combine.tap.api.certificates.signCustomCSR.byteLimit
            Configuration Value (default 65,536 characters)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: "The CSR exceeds the maximum supported size of [65536] bytes!"
        "500":
          description: The certificate signing request could not be signed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Could not sign custom CSR Request. See Error Log.
  /tap/api/v3/config/application:
    get:
      tags:
        - Configuration
      summary: Get the application configuration
      description: Returns the application configuration. Available to any authenticated
        user.
      operationId: getApplicationConfiguration
      responses:
        "200":
          description: The application configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationConfigurationResponse"
        "500":
          description: The application configuration could not be retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
        - Configuration
      summary: Update the application configuration
      description: "Updates the application configuration. Only these fields are\
        \ written: customerName, userLimit, userValidateEmailDomain, userValidateEmailDomainWhitelist,\
        \ sendWelcomeEmail, sendWelcomeEmailWithAttachment, showBundleLinks, enableResourceRoleMasquerade,\
        \ enableAwsApiLogging, the log fields except logIgnoreResponseCodesSuccess and\
        \ logAccountOverrides, enableOCSP, certificateKeySize, certificateHashAlgorithm,\
        \ and the cors fields. Omitted or null fields keep their values, except userValidateEmailDomainWhitelist:\
        \ when it is empty or null, or omitted while no domains are allowed, the deployment's\
        \ default allowed domains are written. An omitted field is written again with\
        \ its current value. Every written field is stored as a Managed Configuration\
        \ Value, which PUT /tap/api/v3/config/application/item then rejects. userValidateEmailDomainWhitelist,\
        \ logIgnoreServices, logIgnoreServicesNever, logIgnoreResponseCodes, logRedactFields,\
        \ corsAccessControlAllowOrigin, and corsAccessControlAllowMethods are split on\
        \ commas, semicolons, spaces, and newlines, de-duplicated, and stored separated\
        \ by spaces. Requires the super_admin role."
      operationId: updateApplicationConfiguration
      security:
        - mutualTLS: []
          xRequestedBy: []
      requestBody:
        description: The application configuration to apply.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationConfiguration"
        required: true
      responses:
        "200":
          description: "The submitted configuration, echoed back. An omitted field
            holds its value from before the update and a field submitted as null is
            omitted, except that an empty or null userValidateEmailDomainWhitelist holds
            the default allowed domains that were written. Every other field is returned
            as submitted: list values are not normalized, and a value submitted for a
            field that is not written (such as awsAccountId or enableToolFirewallRules)
            is echoed but not stored."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationConfigurationUpdateResponse"
        "403":
          description: The caller does not have the super_admin role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "The application configuration could not be updated, including
            when the body is not valid JSON, a value has the wrong type, or a value could
            not be written. Values written before the failure stay written."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tap/api/v3/config/application/email-integration:
    get:
      tags:
        - Configuration
      summary: Get the email integration status
      description: Returns whether email integration is enabled. Available to any
        authenticated user.
      operationId: getEmailIntegrationFlag
      responses:
        "200":
          description: Whether email integration is enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailIntegrationResponse"
        "500":
          description: The email integration status could not be retrieved.
