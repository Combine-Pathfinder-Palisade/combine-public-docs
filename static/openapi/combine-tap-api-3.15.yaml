            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tap/api/v3/servers:
    get:
      tags:
        - Servers
      summary: List servers
      description: "Returns a summary of each server. The complete server is available
        from GET /tap/api/v3/servers/{serverId}. Requires the admin role; a caller with
        the user role receives an empty list. A single page is returned when pageSize,
        page, nextToken, or q is not blank, or when active or includeCounts is true;
        otherwise every server is returned, sorted by fullName. A page is sorted by
        fullName, ignoring case and surrounding whitespace, then by id."
      operationId: getAllServers
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/NextToken"
        - $ref: "#/components/parameters/Query"
        - name: active
          in: query
          description: "When true, returns only active servers."
          schema:
            type: boolean
        - name: includeCounts
          in: query
          description: "When true, the response also includes serverCount and serverCountActive.
            This also selects a single page."
          schema:
            type: boolean
      responses:
        "200":
          description: All servers or a single page of servers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerListResponse"
        "400":
          description: "A paging parameter is invalid: pageSize or page is not a whole\
            \ number, pageSize is outside 1 to 100, page is negative, q is longer than\
            \ 200 characters, or nextToken is malformed or was issued for a different q\
            \ or active value."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller has neither the admin nor the user role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - Servers
      summary: Create a server
      description: "Creates a server and issues its certificate. When csr is not blank, the
        CSR is signed and the certificate bundle contains no private key; otherwise a key
        pair and password are generated. Each AWS role id in awsRoles must belong to an
        existing AWS role; the default AWS roles are assigned when awsRoles is omitted or
        empty. Requires the admin role. When the sendWelcomeEmail setting is on and email
        integration is enabled, the custodian is sent an email; it includes a download link
        valid for 12 hours by default when the showBundleLinks setting is on, and attaches
        the bundle when the sendWelcomeEmailWithAttachment setting is on. If the download
        link cannot be generated, the server is still created but no email is sent, and POST
        /tap/api/v3/servers/{serverId}/resend can send it later. bundlePath in the response
        is the stored location of the certificate bundle, not a download link."
      operationId: createServer
      security:
        - mutualTLS: []
          xRequestedBy: []
      requestBody:
        description: Server to create.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServerCreateRequestV3"
        required: true
      responses:
        "200":
          description: The created server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerCreateResponseV3"
        "400":
          description: "The request body is not a JSON object or a field has the wrong type,
            awsRoles is not a list of AWS role ids (for example, it contains an AWS role
            object), the name, custodian email, or custodian name is missing or blank, csr
            is not a PEM certificate signing request, the CSR signature does not verify
            against its own public key, awsRoles includes an AWS role id that does not
            exist, or the server could not be saved."
