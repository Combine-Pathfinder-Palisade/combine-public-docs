        admin role. bundlePath in the response is the stored location of the certificate
        bundle, not a download link."
      operationId: updateServer
      security:
        - mutualTLS: []
          xRequestedBy: []
      parameters:
        - name: serverId
          in: path
          description: Identifier of the server.
          required: true
          schema:
            type: string
      requestBody:
        description: Fields to change. Omitted fields are left unchanged.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServerUpdateRequestV3"
        required: true
      responses:
        "200":
          description: "The result of the update. When the change could not be saved,
            success is false and data is absent."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerUpdateResponseV3"
        "400":
          description: "The identifier is not a number, awsRoles is not a list of AWS role
