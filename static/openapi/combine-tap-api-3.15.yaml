      type: object
      properties:
        finding:
          type: string
        findingRemediation:
          type: string
        level:
          type: string
          description: Severity of the finding. Every finding is currently reported
            as ERROR.
          enum:
            - ERROR
            - WARNING
            - INFO
        section:
          type: string
          description: "The template section that holds the element the finding is
            for. Only the Resources section is analyzed, so this is RESOURCES."
          enum:
            - METADATA
            - CONDITIONS
            - PARAMETERS
            - RESOURCES
            - MAPPINGS
            - OUTPUTS
        breadcrumbPath:
          type: array
          items:
            type: string
        sourceLineNumber:
          type: integer
          format: int32
          description: "Line of the value in the template, starting at 1. 0 when the
            value could not be located."
        sourceColumn:
          type: integer
          format: int32
          description: "Column of the value in the template, starting at 1. 0 when the
            value could not be located."
        observedValue:
          type: string
          description: The template value that caused the finding. Omitted when the
            finding has none.
        observedHighlightRanges:
          type: array
          items:
            $ref: "#/components/schemas/HighlightRange"
        expectedValue:
          type: string
          description: The suggested replacement for observedValue. Omitted when the
            finding has no suggested replacement.
        expectedHighlightRanges:
          type: array
          items:
            $ref: "#/components/schemas/HighlightRange"
        autoApply:
          type: boolean
          description: "Whether expectedValue can replace observedValue as is. False when
            expectedValue contains a ${...} reference and the value is not inside an
            Fn::Sub, where the reference would be written as literal text. True when the
            finding has no expectedValue."
