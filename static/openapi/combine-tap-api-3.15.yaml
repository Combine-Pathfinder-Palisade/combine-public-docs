          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The certificate bundle download link could not be generated.
            No email was sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tap/api/v3/users:
    get:
      tags:
        - Users
      summary: List users
      description: "Returns a summary of each user. The complete user is available
        from GET /tap/api/v3/users/{userId}. Requires the admin role; a caller with
        the user role receives an empty list. Users with the super_admin role are included
        only for a super_admin caller. A single page is returned when pageSize, page,
        nextToken, or q is not blank, or when active or includeCounts is true; otherwise
        every user is returned, sorted by fullName. A page is sorted by fullName, ignoring
        case and surrounding whitespace, then by id."
      operationId: getAllUsers
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/NextToken"
        - $ref: "#/components/parameters/Query"
        - name: active
          in: query
          description: "When true, returns only active users that count toward the user\
            \ limit (super_admin users never count)."
          schema:
            type: boolean
        - name: includeCounts
          in: query
          description: "When true, the response also includes userCount and userCountActive.
            This also selects a single page."
          schema:
            type: boolean
      responses:
        "200":
          description: All users or a single page of users.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "400":
          description: "A paging parameter is invalid: pageSize or page is not a whole\
            \ number, pageSize is outside 1 to 100, page is negative, q is longer than\
            \ 200 characters, or nextToken is malformed or was issued for a different q\
            \ or active value."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller has neither the admin nor the user role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - Users
      summary: Create a user
      description: "Creates a user, issues the user's certificate, and builds the
        certificate bundle. Requires the admin role. userRole defaults to user when omitted
        or null. Each AWS role id in awsRoles must belong to an existing AWS role; the
        default AWS roles are assigned when awsRoles is omitted or empty. When the
        sendWelcomeEmail setting is on and email integration is enabled, the user is sent a
        welcome email; it includes a download link valid for 12 hours by default when the
        showBundleLinks setting is on, and attaches the bundle when the
        sendWelcomeEmailWithAttachment setting is on. If the download link cannot be
        generated, the user is still created but no email is sent, and POST
        /tap/api/v3/users/{userId}/resend can send it later. bundlePath in the response is
        the stored location of the certificate bundle, not a download link."
      operationId: createUser
      security:
        - mutualTLS: []
          xRequestedBy: []
      requestBody:
        description: User to create.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateRequestV3"
        required: true
      responses:
        "200":
          description: The created user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserCreateResponseV3"
        "400":
          description: "The request body is not a JSON object or a field has the wrong type,
            awsRoles is not a list of AWS role ids (for example, it contains an AWS role
            object), the full name or email is missing or blank, the user role is blank,
            awsRoles includes an AWS role id that does not exist, the email is already used
            by another user (compared without regard to case), the user role is not exactly
            user, admin, or super_admin, or the user could not be saved."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "The caller does not have the admin role, the new user is active and
            the account user limit was reached (checked before the other fields are
            validated), or the caller tried to create a super_admin without being one."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Email domain validation is on and the email domain is not allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "The user could not be created, or the user was created but a later
            step failed. When the certificate could not be generated, the user exists
            without a certificate until POST /tap/api/v3/users/{userId}/certificate is
            called. Certificate generation fails, for example, when the certificate common
            name is longer than 64 characters."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
