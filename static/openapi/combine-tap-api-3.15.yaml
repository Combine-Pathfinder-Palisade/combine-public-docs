components:
  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
    ErrorResponse:
      type: object
      description: "An error result. Also the body of an authentication failure, a
        missing X-Requested-By header, a path that no endpoint serves (Not Found),
        and an unhandled server error (An unexpected error occurred.)."
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
    AlertEvent:
      type: object
      properties:
        id:
          type: string
        count:
          type: integer
          format: int64
          description: Number of times the event has been seen.
        date:
          type: string
          description: "Time the event was last seen, in epoch seconds."
        dateExpires:
          type: string
          description: "Time after which the event is deleted, in epoch seconds. Reopening
            or ignoring the event through this API stores dateExpires as text, which
            DynamoDB never expires, so that event is kept until it is seen again."
        message:
          $ref: "#/components/schemas/Message"
        state:
          type: string
          description: State of the alert event, either open or ignored.
    Field:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
        referenceDataId:
          type: string
        referenceDataType:
          type: string
    Message:
      type: object
      properties:
        type:
          type: string
        summary:
          type: string
        fields:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Field"
        lastSeen:
          type: string
        lastSeenFields:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Field"
    AlertEventResponse:
      type: object
      description: The requested alert event.
      properties:
        data:
          $ref: "#/components/schemas/AlertEvent"
    AlertEventListResponse:
      type: object
      description: A list of alert events.
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AlertEvent"
    AssumedRoleUser:
      type: object
      description: "Identifiers of the assumed role session. The session name is the
        common name of the caller's client certificate, up to its first comma, with
        every character other than A-Z, a-z, and 0-9 removed."
      properties:
        AssumedRoleId:
          type: string
          description: Unique identifier of the assumed role session.
          example: AROAEXAMPLEID:JaneDoe
        Arn:
          type: string
          description: "Amazon Resource Name of the assumed role session, in the partition
            that hosts the Combine deployment. It is not rewritten to the emulated partition."
          example: arn:aws:sts::123456789012:assumed-role/ExampleRole/JaneDoe
      required:
        - Arn
        - AssumedRoleId
    AwsCredentials:
      type: object
      description: Temporary AWS security credentials for the assumed role.
      properties:
        AccessKeyId:
          type: string
          description: AWS access key ID.
          example: ASIAIOSFODNN7EXAMPLE
        SecretAccessKey:
          type: string
          description: AWS secret access key.
          example: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
        SessionToken:
          type: string
          description: AWS session token for the temporary credentials.
          example: FQoGZXIvYXdzEExampleSessionTokenABC123
        Expiration:
          type: string
          description: "Expiration time of the credentials, in UTC, formatted as YYYY-MM-DDTHH:MM:SSZ."
          example: "2026-07-06T12:34:56Z"
      required:
        - AccessKeyId
        - Expiration
        - SecretAccessKey
        - SessionToken
    CredentialsResponse:
      type: object
      description: "Temporary AWS credentials and the assumed role session, from an
        AWS STS AssumeRole call in the partition that hosts the Combine deployment."
      properties:
        Credentials:
          $ref: "#/components/schemas/AwsCredentials"
        AssumedRoleUser:
          $ref: "#/components/schemas/AssumedRoleUser"
      required:
        - AssumedRoleUser
        - Credentials
    MassEmailRequest:
      type: object
      description: The recipients and content of a mass email.
      properties:
        includeAllUsers:
          type: boolean
          description: "When true, include inactive users as well as active users; when
            false, only active users."
          example: true
        includeNPE:
          type: boolean
          description: "When true, also include server (non-person entity) accounts.
            When includeAllUsers is false, servers are included whether or not they are
            active."
          example: false
        subject:
          type: string
          description: Subject line of the email.
          example: Scheduled maintenance
        body:
          type: string
          description: Body of the email, sent as HTML; each newline is converted to
            <br/>.
          example: The system will be unavailable on Saturday.
      required:
        - body
        - includeAllUsers
        - includeNPE
        - subject
    AwsRole:
      type: object
      properties:
        id:
          type: integer
          format: int64
        environment:
          type: string
          description: "Identifier of the cloud partition the role belongs to, such\
            \ as AWS_C2S, AWS_SC2S, or AWS_GOV_CLOUD."
          example: AWS_C2S
        defaultRole:
          type: boolean
          description: Whether the role is assigned to new users and servers that are
            created without any AWS roles.
        account:
          $ref: "#/components/schemas/AwsRolePair"
          description: "The AWS account. value is the account number; valueAlias is\
            \ the account (mission) name used by the CAP, SCAP, and login endpoints."
        agency:
          $ref: "#/components/schemas/AwsRolePair"
          description: "The agency. valueAlias is the agency name used by the CAP,\
            \ SCAP, and login endpoints. Defaults to Combine when omitted."
        role:
          $ref: "#/components/schemas/AwsRolePair"
          description: "The IAM role. value is the IAM role name that is assumed; valueAlias\
            \ is the role name used by the CAP, SCAP, and login endpoints."
    AwsRoleRequest:
      type: object
      description: "AWS role values accepted when creating or updating an AWS role.
        An id in the request body is ignored: the server assigns it on create, and
        update uses the path identifier."
      properties:
        environment:
          type: string
          description: "Identifier of an emulated AWS partition defined for the deployment,
            matched case-sensitively, such as AWS_C2S, AWS_SC2S, or AWS_GOV_CLOUD."
          example: AWS_C2S
        defaultRole:
          type: boolean
          description: "Whether the role is assigned to new users and servers that
            are created without any AWS roles. Defaults to false on create; on update
            it is changed only when present."
        account:
          $ref: "#/components/schemas/AwsRolePair"
          description: "The AWS account. value (the account number) and valueAlias
            (the account (mission) name) must not be blank."
        agency:
          $ref: "#/components/schemas/AwsRolePair"
          description: "The agency. When provided, value and valueAlias must not be
            blank. When omitted, value and valueAlias are set to Combine."
        role:
          $ref: "#/components/schemas/AwsRolePair"
          description: "The IAM role. value (the IAM role name that is assumed) and
            valueAlias (the role name) must not be blank."
      required:
        - environment
        - account
        - role
    AwsRoleListResponse:
      type: object
      description: A list of AWS roles.
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AwsRole"
    AwsRolePair:
      type: object
      properties:
        value:
          type: string
        valueAlias:
          type: string
        valueDescription:
          type: string
        empty:
          type: boolean
          readOnly: true
          description: Whether value or valueAlias is blank. Computed; ignored on input.
    AwsRoleResponse:
      type: object
      description: The requested AWS role.
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/AwsRole"
    AwsRoleDeleteResponse:
      type: object
      description: Confirmation that an AWS role was deleted.
      properties:
        success:
          type: boolean
        data:
          type: string
          example: Role Deleted
    ApplicationConfiguration:
      type: object
      properties:
        awsAccountId:
          type: string
        customerName:
          type: string
        userLimit:
          type: integer
          format: int32
        userValidateEmailDomain:
          type: boolean
        userValidateEmailDomainWhitelist:
          type: string
          description: "The allowed email domains. A read returns them separated by
            commas. An update accepts them separated by commas, semicolons, spaces, or
