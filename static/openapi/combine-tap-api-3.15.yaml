        matchedGroup:
          type: string
          description: Name of the matched firewall rule group.
        ruleGroupArn:
          type: string
          description: ARN of the matched firewall rule group.
        firewallAttached:
          type: boolean
          description: "Whether at least one firewall policy uses the rule group. True
            when AWS Network Firewall does not report the number of policies that use
            it."
