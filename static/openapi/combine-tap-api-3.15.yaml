          example: https://health.example.com
        workloadHealthMarkup:
          type: string
          description: Custom markup displayed alongside the workload health dashboard.
        lastUpdateDate:
          type: string
          description: "Time the workload health configuration was last updated, in
            UTC."
          example: "Mon, 6 Jul 2026 12:34:56"
    WorkloadHealthResponse:
      type: object
      description: The workload health configuration.
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/WorkloadHealth"
    LogsInsightsLogGroupsResponse:
      type: object
      description: The log groups that a Logs Insights query can target.
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            logGroupTap:
              type: string
              description: "Name of the TAP server log group, from the combine.infrastructure.logGroup.tap
                Configuration Value. Omitted when that value is not set."
            logGroupEndpoint:
              type: string
              description: "Name of the Endpoint server log group, from the combine.infrastructure.logGroup.endpoint
                Configuration Value. Omitted when that value is not set."
            shardId:
              type: string
              description: The deployment's Shard ID. An empty string when the deployment
                has none.
    LogsInsightsQueryRequest:
      type: object
      description: A Logs Insights query.
      properties:
        queryString:
          type: string
          description: "The CloudWatch Logs Insights query. A limit command is appended
            to it."
          example: "fields @timestamp, @message | sort @timestamp desc"
        logGroupName:
          type: string
          description: "The log group to query: logGroupTap or logGroupEndpoint from
            GET /tap/api/v3/tools/logs-insights/log-groups."
        startTime:
          type: integer
          format: int64
          description: "Start of the time range, in seconds since the Unix epoch. A
            numeric string is also accepted. Defaults to 24 hours before the request when
            omitted, null, or not a number."
          example: 1783339200
        endTime:
          type: integer
          format: int64
          description: "End of the time range, in seconds since the Unix epoch. A numeric
            string is also accepted. Defaults to the time of the request when omitted,
            null, or not a number."
          example: 1783425600
      required:
        - queryString
        - logGroupName
    LogsInsightsQueryResponse:
      type: object
      description: The results of a Logs Insights query.
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            queryName:
              type: string
              description: Always an empty string.
            logGroupName:
              type: string
              description: The log group that was queried.
            status:
              type: string
              description: "The query status: Complete, or Scheduled or Running when
                the query was stopped before it finished."
              example: Complete
            records:
              type: array
              description: "The result rows. Each row maps a result field name, such
                as @timestamp, @message, or @ptr, to its value."
              items:
                type: object
                additionalProperties:
                  type: string
            scannedBytes:
              type: number
              description: "Bytes scanned by the query, from the query statistics. 0
                when no statistics were returned."
              example: 52344.0
            recordsMatched:
              type: number
              description: "Records that matched the query, from the query statistics.
                0 when no statistics were returned."
              example: 120.0
    IamUserCredentialsRegisterRequest:
      type: object
      description: The IAM user access key to register.
      properties:
        accessKeyId:
          type: string
          description: "The IAM user access key ID: AKIA followed by 16 uppercase letters
            or digits. Leading and trailing whitespace is ignored."
          pattern: "^AKIA[A-Z0-9]{16}$"
          example: AKIAIOSFODNN7EXAMPLE
        secretAccessKey:
          type: string
          description: The secret access key. Leading and trailing whitespace is ignored.
        overwrite:
          type: boolean
          description: "Set to true to replace credentials that are already registered
            for accessKeyId. Any other value, including the string \"true\", is treated as false."
          default: false
      required:
        - accessKeyId
        - secretAccessKey
    IamUserCredentialsRegisterResponse:
      type: object
      description: The result of registering IAM user credentials.
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            overwritten:
              type: boolean
              description: Whether credentials were already registered for the access
                key ID and were replaced.
    IamUserCredentialsCheckRequest:
      type: object
      description: The IAM user access key ID to check.
      properties:
        accessKeyId:
          type: string
          description: "The IAM user access key ID: AKIA followed by 16 uppercase letters
            or digits. Leading and trailing whitespace is ignored."
          pattern: "^AKIA[A-Z0-9]{16}$"
          example: AKIAIOSFODNN7EXAMPLE
      required:
        - accessKeyId
    IamUserCredentialsCheckResponse:
      type: object
      description: Whether credentials are registered for an IAM user access key ID.
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            registered:
              type: boolean
              description: Whether credentials are registered for the access key ID.
