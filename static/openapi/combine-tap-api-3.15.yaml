          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No server exists with the given identifier, or the identifier belongs to a user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
