      operationId: resendCertificate_1
      security:
        - mutualTLS: []
          xRequestedBy: []
      parameters:
        - name: serverId
          in: path
          description: Identifier of the server.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The email was sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: "The server is unknown (including an identifier that belongs\
            \ to a user), the identifier is invalid, email integration is not enabled,\
            \ or the certificate email could not be sent."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller does not have the admin role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The certificate bundle download link could not be generated.
