    ServerListResponse:
      type: object
      description: All servers or a single page of servers (GET /tap/api/v3/servers and GET /tap/api/v2/servers).
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ServerSummary"
        pageSize:
          type: integer
          format: int32
          description: The page size used. Present only for a paged response.
          example: 25
        nextToken:
          type: string
          description: "Token for the next page, sent back as nextToken. Present only\
            \ when more results remain."
        serverCount:
          type: integer
          format: int32
          description: Number of servers matching the request. Present only when includeCounts
