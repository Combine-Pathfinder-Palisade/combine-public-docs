      type: object
      description: The current custom firewall rules.
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/FirewallRules"
    FirewallRuleGroup:
      type: object
      description: A Combine firewall override rule group and its VPC.
      properties:
        ruleGroupName:
          type: string
          description: Name of the rule group.
        vpcId:
          type:
            - string
            - "null"
          description: "Identifier of the VPC in the account whose Name tag (or, for
            a VPC without one, VPC ID) matches the rule group's Combine VPC tag, ignoring
            case. Null when the rule group has no Combine VPC tag or no VPC matches."
          example: vpc-0123456789abcdef0
        vpcName:
          type:
            - string
            - "null"
          description: Value of the rule group's Combine VPC tag. Null when the rule
            group has no Combine VPC tag or it is blank.
    FirewallRuleGroupListResponse:
      type: object
      description: The Combine firewall override rule groups.
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            ruleGroups:
              type: array
              description: "The rule groups, in the order AWS Network Firewall lists
                them. Empty when none is found."
              items:
                $ref: "#/components/schemas/FirewallRuleGroup"
    WorkloadHealth:
      type: object
      description: "The workload health configuration values. Each value is an empty
        string when it has not been set."
