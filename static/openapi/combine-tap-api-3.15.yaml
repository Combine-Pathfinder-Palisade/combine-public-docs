          in: path
          description: Identifier of the server.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The certificate bundle was rebuilt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: "The server is unknown (including an identifier that belongs\
