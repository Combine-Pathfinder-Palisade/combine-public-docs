  /tap/api/v3/certificate/certificate-expiration-date:
    get:
      tags:
        - Certificates
      summary: Get certificate authority expiration dates
      description: Returns the expiration dates of the signer and root certificate
        authority certificates, read from the deployment's DevOps bucket. Available
        to any authenticated user.
      operationId: getCertificateExpirationDates
      responses:
        "200":
          description: The certificate authority expiration dates. A date that could
            not be read is null; the status is still 200.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateExpirationResponse"
  /tap/api/v1/certificate/ocsp:
    post:
      tags:
        - Certificates
      summary: Process an OCSP request
      description: "Checks the revocation status of the certificates in a DER-encoded
        OCSP request and returns a signed OCSP response. Requires the OCSP responder
        to be enabled (the combine.aws.certificates.ocsp Configuration Value, default
        false). Served only at /tap/api/v1/certificate/ocsp. Does not require a client
        certificate or the X-Requested-By header, and is also served over HTTP. A
        request larger than the combine.tap.ocsp.responder.request.byteLimit Configuration
        Value (default 8,192 bytes) receives an OCSP malformedRequest response, even
        when the responder is not enabled. A certificate not issued by the deployment's
        signer certificate authority is reported as unknown. The response is signed
        with the signer certificate authority's key, echoes the request's nonce, and
        sets nextUpdate to the combine.tap.ocsp.responder.nextUpdate.duration Configuration
        Value (default 86,400,000 milliseconds) after the time of the response."
      operationId: handleRequest
      security: []
      requestBody:
        description: The DER-encoded OCSP request.
        content:
          application/ocsp-request:
            schema:
              format: binary
        required: true
      responses:
        "200":
          description: "The signed OCSP response, or an OCSP malformedRequest response
            when the request is too large."
          content:
            application/ocsp-response:
              schema:
                format: binary
        "404":
          description: The OCSP responder is not enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Not Found
        "415":
          description: The Content-Type is not application/ocsp-request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: An unexpected error occurred.
        "500":
          description: The OCSP request could not be processed, including a request
            body that is not a DER-encoded OCSP request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: An unexpected error occurred.
  /tap/api/v1/certificate/ocsp/{request}:
    get:
      tags:
        - Certificates
      summary: Process an OCSP request (GET)
      description: "The RFC 6960 GET form of the OCSP responder. Checks the revocation\
        \ status of the certificates in the OCSP request carried in the rest of the\
        \ path and returns a signed OCSP response. Requires the OCSP responder to be\
        \ enabled (the combine.aws.certificates.ocsp Configuration Value, default false).\
        \ Served only under /tap/api/v1/certificate/ocsp/. Does not require a client\
        \ certificate, and is also served over HTTP. A request that is not valid Base64\
        \ receives an OCSP malformedRequest response, even when the responder is not\
        \ enabled. Over HTTPS, a path that contains an encoded slash (%2F) is rejected\
        \ with 400 before it reaches the responder; over HTTP, as in the OCSP responder\
        \ URL of an issued certificate, it is accepted."
      operationId: handleRequestEncoded
      security: []
      parameters:
        - name: request
          in: path
          description: "The DER-encoded OCSP request, encoded with standard Base64 and
            then URL-encoded. It occupies the rest of the path and may contain unescaped
            / characters. An unescaped + is read as +, not as a space."
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "The signed OCSP response, or an OCSP malformedRequest response\
            \ when the request is not valid Base64."
          content:
            application/ocsp-response:
              schema:
                format: binary
        "400":
          description: The request was made over HTTPS and its path contains an encoded
            slash (%2F).
        "404":
          description: The OCSP responder is not enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Not Found
        "500":
          description: The OCSP request could not be processed, including a request
            that decodes but is not a DER-encoded OCSP request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: An unexpected error occurred.
  /tap/api/v3/documentation/service-endpoints:
    get:
      tags:
        - Documentation
      summary: List service endpoints
      description: "Returns the hostname of each supported service endpoint in each
        region of the active emulated partition, keyed by region ID and then by the
        endpoint's display name (for example EC2 or S3 Control). An endpoint prefix
        that the region does not support is left out. Returns an empty object when
        no partition is active."
      operationId: getAllServiceEndpoints
      responses:
        "200":
          description: "Endpoint hostnames keyed by region ID, then by endpoint display
            name."
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    type: string
                    example: ec2.us-iso-east-1.c2s.ic.gov
  /tap/api/v3/documentation/supported-vpce-service-names:
    get:
      tags:
        - Documentation
      summary: List supported VPC endpoint service names
      description: "Returns the supported VPC endpoint service names for each region
        of the active emulated partition, in alphabetical order of region ID, written
        as the emulated partition names them. In each configured name, a leading *
        becomes com.amazonaws. followed by the region ID, any other * is replaced by
        the region ID, and the prefix of a service that the emulated partition names
        with its own prefix is replaced by that prefix (for example gov.ic.c2s.us-iso-east-1.autoscaling).
        A region with no names configured has an empty list. Returns an empty array
        when no partition is active."
      operationId: getAllServiceNames
      responses:
        "200":
          description: The supported VPC endpoint service names.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupportedServiceNames"
  /tap/api/v3/documentation/supported-instance-types:
    get:
      tags:
        - Documentation
      summary: List supported instance types
      description: "Returns the supported instance types for EC2, ElastiCache, RDS,
        and EMR in the active emulated partition, one entry for each service, grouped
        by instance family. Each region's list is read from its per-Region Configuration
        Value, such as combine.endpoints.aws.metadata.ec2.supportedTypes.us-iso-east-1.
        Returns an empty array when no partition is active."
      operationId: getAllSupportedInstanceTypes
      responses:
        "200":
          description: The supported instance types.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupportedInstanceTypes"
  /tap/api/v3/documentation/supported-bedrock-models:
    get:
      tags:
        - Documentation
      summary: List supported Bedrock models
      description: "Returns the supported Bedrock models for the active emulated
        environment, both as a union and for each Region. Each Region's list is read
        from its per-Region Configuration Value, such as combine.endpoints.aws.metadata.bedrock.supportedModels.us-iso-east-1.
        Returns an empty array when no partition is active."
      operationId: getBedrockSupportedModels
      responses:
        "200":
          description: The supported Bedrock models.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupportedBedrockModels"
  /tap/api/v3/documentation/supported-eks-cluster-versions:
    get:
      tags:
        - Documentation
      summary: List supported EKS cluster versions
      description: "Returns the supported EKS cluster versions for the active emulated
        partition: the partition's list, or the list in its override Configuration
        Value (such as combine.endpoints.aws.filter.eks.clusterVersion.aws_c2s.override.versions.allowed)
        when that is set, without any version listed in the matching .except Configuration
        Value. Returns an empty array when no partition is active."
      operationId: getEksClusterVersions
      responses:
        "200":
          description: The supported EKS cluster versions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupportedEksClusterVersions"
  /tap/api/v3/documentation/supported-rds-engine-versions:
    get:
      tags:
        - Documentation
      summary: List supported RDS engine versions
      description: "Returns the supported RDS engine versions for each engine of
        the active emulated partition, in no guaranteed order. An engine's list is
        the partition's list, or the list in its override Configuration Value (such
        as combine.endpoints.aws.filter.rds.engineVersion.aws_c2s.engine.mysql.override.supportedVersions)
        when that is set. Returns an empty array when no partition is active."
      operationId: getRdsEngineVersions
      responses:
        "200":
          description: The supported RDS engine versions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupportedRdsEngineVersions"
  /tap/api/v3/documentation/partition-info:
    get:
      tags:
        - Documentation
      summary: Get the emulated partition details
      description: "Returns the AWS partition ID, endpoint domain, and root region
        of the active emulated partition, and the host region that each of its regions
        is mapped to. Returns an empty object when no partition is active. Available
        to any authenticated user."
      operationId: getPartitionInfo
      responses:
        "200":
          description: The emulated partition details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartitionInfo"
  /tap/api/v3/documentation/trust-policy:
    get:
      tags:
        - Documentation
      summary: Get the trust policy for a self-managed IAM role
      description: "Returns the IAM trust policy statement that a self-managed IAM
        role needs so that Combine can assume it. The statement trusts the deployment's
        Combine Endpoints role and, when a User Management Account is configured, that
        account's follower principal (or its root when no follower principal is set).
        Returns an empty object when the statement could not be built. Available to
        any authenticated user."
      operationId: getTrustPolicy
      responses:
        "200":
          description: "The trust policy statement, or an empty object."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrustPolicyResponse"
  /tap/api/v3/documentation/supported-elasticache-engine-versions:
    get:
      tags:
        - Documentation
      summary: List supported ElastiCache engine versions
      description: "Returns the supported ElastiCache engine versions of the active
        emulated partition for the memcached, redis, and valkey engines, in that order.
        Each list is read from a Configuration Value such as combine.endpoints.aws.metadata.elasticache.engineVersion.aws_c2s.engine.redis.versions.
        An engine with no versions configured is omitted. Returns an empty array when
        no partition is active."
      operationId: getElastiCacheEngineVersions
      responses:
        "200":
          description: The supported ElastiCache engine versions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupportedElastiCacheEngineVersions"
  /tap/api/v3/documentation/supported-lambda-runtime-versions:
    get:
      tags:
        - Documentation
      summary: List supported Lambda runtimes
      description: "Returns the supported Lambda runtimes of the active emulated
        partition. Returns an empty array when no partition is active."
      operationId: getLambdaSupportedRuntimeVersions
      responses:
        "200":
          description: The supported Lambda runtimes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupportedLambdaRuntimeVersions"
  /tap/api/v3/documentation/supported-fips-endpoints:
    get:
      tags:
        - Documentation
      summary: List supported FIPS endpoints
      description: "Returns the services that have a FIPS endpoint in the active
        emulated partition, and the FIPS endpoint hostnames of each region by service.
        When a region's override Configuration Value (such as combine.endpoints.aws.metadata.serviceEndpoints.fips.supported.override.us-iso-east-1)
        is set, the region's supported services that it names are listed. Otherwise,
        the region's supported services that are in its FIPS endpoint list are listed,
        or every supported service when the region does not enforce that list. Returns
        an empty array when no partition is active."
      operationId: getFipsSupportedEndpoints
      responses:
        "200":
          description: The supported FIPS endpoints.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupportedFipsEndpoints"
  /tap/api/v3/documentation/service-principals:
    get:
      tags:
        - Documentation
      summary: List service principal suffixes
      description: "Returns the service principal domain suffixes of the active emulated
        partition and the services whose service principal uses the partition's suffix.
        Returns an empty array when no partition is active, or when the partition has
        no service that uses its suffix (servicePrincipalsWithSuffix, servicePrincipalsWithSuffixOptional,
        and servicePrincipalsWithOptionalSuffixOverride are all empty)."
      operationId: getServicePrincipals
      responses:
        "200":
          description: The service principal suffixes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServicePrincipals"
  /tap/api/v3/groups:
    get:
      tags:
        - Groups
      summary: List all groups
      description: "Returns every group, sorted by name (ignoring case). Requires the
        admin role."
      operationId: getAllGroups
      responses:
        "200":
          description: All groups.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupListResponse"
        "403":
          description: The caller does not have the admin role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - Groups
      summary: Create a group
      description: Creates a new group. Requires the admin role.
      operationId: createGroup
      security:
        - mutualTLS: []
          xRequestedBy: []
      requestBody:
        description: Group to create.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupCreateRequest"
        required: true
      responses:
        "200":
          description: The created group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupResponse"
        "400":
          description: The group name is missing or blank.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Another group already has this name. Names are compared without
            regard to case or surrounding whitespace."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller does not have the admin role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "The group could not be created, including when the request
            body is not a JSON object or a field has the wrong type."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tap/api/v3/groups/{groupId}:
    get:
      tags:
        - Groups
      summary: Get a group
      description: Returns a single group by its identifier. Requires the admin role.
      operationId: getGroup
      parameters:
        - name: groupId
          in: path
          description: Identifier of the group.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The requested group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupResponse"
        "403":
          description: The caller does not have the admin role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No group exists with the given identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
        - Groups
      summary: Update a group
      description: Updates a group. Only the fields present in the request body are
        changed. Requires the admin role.
      operationId: updateGroup
      security:
        - mutualTLS: []
          xRequestedBy: []
      parameters:
        - name: groupId
          in: path
          description: Identifier of the group.
          required: true
          schema:
            type: string
      requestBody:
        description: Fields to change; omitted fields are left unchanged.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupUpdateRequest"
        required: true
      responses:
        "200":
          description: The updated group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupResponse"
        "400":
          description: The group name was provided but is blank.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Another group already has the new name. Names are compared without
            regard to case or surrounding whitespace; resubmitting the group's own name
            is accepted."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller does not have the admin role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No group exists with the given identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "The group could not be updated, including when the request
            body is not a JSON object or a field has the wrong type."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
        - Groups
      summary: Delete a group
      description: Deletes a group and all of its memberships. Requires the admin
        role.
      operationId: deleteGroup
      security:
        - mutualTLS: []
          xRequestedBy: []
      parameters:
        - name: groupId
          in: path
          description: Identifier of the group.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The group was deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "403":
          description: The caller does not have the admin role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No group exists with the given identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The group could not be deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tap/api/v3/groups/{groupId}/members:
    get:
      tags:
        - Groups
      summary: List group members
      description: "Returns the members of a group. Requires the admin role. Members\
        \ with the super_admin role are included only for a super_admin caller."
      operationId: getMembers
      parameters:
        - name: groupId
          in: path
          description: Identifier of the group.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The group's members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupMembershipListResponse"
        "403":
          description: The caller does not have the admin role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No group exists with the given identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - Groups
      summary: Add members to a group
      description: "Adds one or more users to a group. Every ID is checked, in order,
        before any membership is written, so a 400, 403, or 404 response adds no one
        and reports the first ID that fails. Users already in the group are skipped.
        Each membership stores a copy of the user's fullName, email, and userRole.
        Requires the admin role."
      operationId: addMembers
      security:
        - mutualTLS: []
          xRequestedBy: []
      parameters:
        - name: groupId
          in: path
          description: Identifier of the group.
          required: true
          schema:
            type: string
      requestBody:
        description: "Users to add, specified as userId or userIds."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMembersRequest"
        required: true
      responses:
        "200":
          description: The memberships that were created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddMembersResponse"
        "400":
          description: "The request body has neither userId nor userIds, userIds is
            empty, or an ID is not a decimal number (\"Invalid User [{id}].\")."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "The caller does not have the admin role, or one of the users\
            \ is a super_admin and the caller is not."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "The group was not found (\"User Group not found.\"), or an
            ID is not a user (\"User [{id}] not found.\"). A server ID is treated as
            not found, in userId and in userIds alike."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "The request body is malformed: not a JSON object, userId is
            null, or userIds is not an array of IDs. A membership that cannot be saved
            is left out of data instead of causing an error."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tap/api/v3/groups/{groupId}/members/{userId}:
    delete:
      tags:
        - Groups
      summary: Remove a member from a group
      description: "Removes a user from a group. The membership is removed even when
        its ID no longer belongs to a user, or belongs to a server. Requires the admin
        role."
      operationId: removeMember
      security:
        - mutualTLS: []
          xRequestedBy: []
      parameters:
        - name: groupId
          in: path
          description: Identifier of the group.
          required: true
          schema:
            type: string
        - name: userId
          in: path
          description: Identifier of the user to remove.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The member was removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "403":
          description: "The caller does not have the admin role, or the user is a super_admin\
            \ and the caller is not."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The group was not found or the user is not a member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The member could not be removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tap/api/v3/groups/user/{userId}:
    get:
      tags:
        - Groups
      summary: List a user's groups
      description: "Returns the groups a user belongs to, sorted by name (ignoring
        case). An unknown user ID returns an empty list. Allowed for an admin or the
        user themselves."
      operationId: getGroupsForUser
      parameters:
        - name: userId
          in: path
          description: Identifier of the user.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The user's groups.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupListResponse"
        "403":
          description: The caller is neither an admin nor the user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tap/api/v3/groups/user/{userId}/memberships:
    put:
      tags:
        - Groups
      summary: Replace a user's group memberships
      description: "Sets the complete set of groups a user belongs to. The user is
        added to each listed group they are not in, and removed from each group they
        are in that is not listed, so an empty groupIds removes every membership. Every
        group to be added is checked before any membership changes, so a 404 changes
        nothing. Each new membership stores a copy of the user's fullName, email, and
        userRole. A membership that cannot be saved or removed is skipped without an
        error. Unlike POST /tap/api/v3/groups/{groupId}/members, a server ID is accepted,
        so a server can be made a group member. Requires the admin role."
      operationId: setMembershipsForUser
      security:
        - mutualTLS: []
          xRequestedBy: []
      parameters:
        - name: userId
          in: path
          description: "Identifier of the user, as a decimal number. It is used as
            sent, so a form with a leading zero or plus sign finds the user but does
            not match their existing memberships."
          required: true
          schema:
            type: string
      requestBody:
        description: The complete set of group IDs the user should belong to.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMembershipsRequest"
        required: true
      responses:
        "200":
          description: The memberships were updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: "The user ID is not a decimal number, the request body has no
            groupIds, or the request body is not a JSON object whose groupIds is an
            array of IDs."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "The caller does not have the admin role, or the user is a super_admin\
            \ and the caller is not."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "No user or server exists with the given ID (\"User not found.\"),
            or a group to be added does not exist (\"User Group not found.\")."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The memberships could not be updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tap/api/v3/groups/me:
    get:
      tags:
        - Groups
      summary: List my groups
      description: "Returns the groups the authenticated user belongs to, sorted by
        name (ignoring case)."
      operationId: getMyGroups
      responses:
        "200":
          description: The caller's groups.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupListResponse"
  /tap/api/v3/metadata/all-configurations:
    get:
      tags:
        - Metadata
      summary: Get all configuration
      description: "Returns every configuration value of the Endpoint Server, defaults
        overlaid by stored values. Available to any authenticated caller when application
        metadata is enabled."
      operationId: getAllConfigurations
      responses:
        "200":
          description: The Endpoint Server configuration.
          content:
            application/json:
              schema:
                type: object
                properties:
                  configuration:
                    type: object
                    description: Configuration values keyed by property name.
                    additionalProperties:
                      type: string
                  configurationTypesFromStore:
                    type: object
                    description: "The type recorded for each stored value that has one,
                      keyed by property name, such as MANAGED for a value set by the
                      Combine CloudFormation Template or the TAP Dashboard."
                    additionalProperties:
                      type: string
        "404":
          description: Application metadata is not enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The API configuration could not be retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tap/api/v3/metadata/api-handler-status:
    get:
      tags:
        - Metadata
      summary: Get API handler configuration
      description: "Returns the AWS API rewriters and filters loaded by the Endpoint
        Server and their enablement configuration. Available to any authenticated
        caller when application metadata is enabled."
      operationId: getRewriterFilterStatus
      responses:
        "200":
          description: The API handler configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiHandlerStatus"
        "404":
          description: Application metadata is not enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The API handler configuration could not be retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tap/api/v3/reference-data/{id}:
    get:
      tags:
        - Metadata
      summary: Get reference data
      description: "Returns the reference data stored under the given identifier.
        Available to any authenticated user."
      operationId: getReferenceData
      parameters:
        - name: id
          in: path
          description: Identifier of the reference data.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "The reference data text (JSON or Markdown, per the referring
            Alert Event field's referenceDataType)."
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: "No reference data exists for the identifier, or it could not
            be read. A read failure is reported as not found, not as 500."
          content:
            text/plain:
              schema:
                type: string
              example: "Could not find reference data [example-id]!"
  /tap/api/v3/tools/analyze/cloudformation/template:
    post:
      tags:
        - Tools
      summary: Analyze a CloudFormation template
      description: "Analyzes an uploaded CloudFormation template against a cloud partition
        and returns the findings for each resource. Available to any authenticated
        user."
      operationId: analyzeCloudFormationTemplate
      security:
        - mutualTLS: []
          xRequestedBy: []
      requestBody:
        description: The CloudFormation template and the environment to analyze it
          against.
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CloudFormationTemplateRequest"
        required: true
      responses:
        "200":
          description: The analysis findings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateAnalysisResponse"
        "400":
          description: "The environment is unrecognized, the file name does not end
            in yaml, yml, or json, or the file is missing or could not be parsed or analyzed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "The CloudFormation template analysis tool is not enabled (the
            combine.tap.tools.analyzeCloudFormationTemplate.enable Configuration Value,
            true by default)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: "The template exceeds the maximum size, set by the combine.tap.tools.analyzeCloudFormationTemplate.byteLimit
            Configuration Value (default 2,097,152 bytes)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tap/api/v3/tools/firewall-rules:
    get:
      tags:
        - Tools
      summary: List the firewall override rule groups
      description: "Lists the Combine firewall override rule groups of this deployment
        and the VPC of each one. A rule group is listed when it carries the Combine
        firewall override rule group tag and, when the deployment has a Shard ID, that
        Shard ID's tag. The list is cached for the time set by the combine.infrastructure.state.cache.duration
        Configuration Value (default 900,000 milliseconds). Requires the admin role."
      operationId: listFirewallRuleGroups
      responses:
        "200":
          description: The firewall override rule groups.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirewallRuleGroupListResponse"
        "403":
          description: The caller does not have the admin role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "The firewall rules tool is not enabled (the combine.tap.tools.firewallRules.enable
            Configuration Value, true by default)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "The rule groups could not be listed, including when none was
            found and the tags of at least one rule group could not be read."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tap/api/v3/tools/firewall-rules/{ruleGroupName}:
    get:
      tags:
        - Tools
      summary: Get the custom firewall rules
      description: "Returns the Suricata rules of the named Combine firewall override
        rule group. Requires the admin role."
      operationId: viewFirewallRules
      parameters:
        - name: ruleGroupName
          in: path
          description: "Name of a rule group listed by GET /tap/api/v3/tools/firewall-rules.
            Matched exactly, including case."
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The custom firewall rules.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirewallRulesResponse"
        "403":
          description: The caller does not have the admin role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "The firewall rules tool is not enabled (the combine.tap.tools.firewallRules.enable
            Configuration Value, true by default), or no Combine firewall override rule
            group has this name."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: More than one Combine firewall override rule group has this
            name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "The firewall rules could not be read, including when the rule
            groups could not be listed, or none was found and the tags of at least one
            rule group could not be read."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - Tools
      summary: Update the custom firewall rules
      description: "Applies Suricata rules to the named Combine firewall override
        rule group, keeping its stateful rule options. Requires the admin role."
      operationId: editFirewallRules
      security:
        - mutualTLS: []
          xRequestedBy: []
      parameters:
        - name: ruleGroupName
          in: path
          description: "Name of a rule group listed by GET /tap/api/v3/tools/firewall-rules.
            Matched exactly, including case."
          required: true
          schema:
            type: string
      requestBody:
        description: The firewall rules to apply.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FirewallRulesUpdateRequest"
        required: true
      responses:
        "200":
          description: The firewall rules were applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirewallRulesUpdateResponse"
        "400":
          description: "The rules value is missing, or AWS Network Firewall returned
            an error, such as rejecting the rules; the message is the AWS error message."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller does not have the admin role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "The firewall rules tool is not enabled (the combine.tap.tools.firewallRules.enable
            Configuration Value, true by default), or no Combine firewall override rule
            group has this name."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: More than one Combine firewall override rule group has this
            name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "The firewall rules could not be updated, including when no
            rule group was found and the tags of at least one rule group could not be
            read."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tap/api/v3/tools/workload-health:
    get:
      tags:
        - Tools
      summary: Get the workload health configuration
      description: "Returns the configured workload health dashboard and its markup.
        Available to any authenticated user."
      operationId: viewworkloadHealth
      responses:
        "200":
          description: The workload health configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkloadHealthResponse"
        "404":
          description: "The workload health tool is not enabled (the combine.tap.tools.workloadHealth.enable
            Configuration Value, false by default)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - Tools
      summary: Update the workload health configuration
      description: "Sets the workload health dashboard endpoint and, when workloadHealthMarkup
        is provided, its markup. Requires the admin role."
      operationId: editworkloadHealth
      security:
        - mutualTLS: []
          xRequestedBy: []
      requestBody:
        description: The workload health configuration to set.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkloadHealthUpdateRequest"
        required: true
      responses:
        "200":
          description: The workload health configuration was updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "403":
          description: The caller does not have the admin role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "The workload health tool is not enabled (the combine.tap.tools.workloadHealth.enable
            Configuration Value, false by default)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "workloadHealthEndpoint is missing or null, or the configuration
            could not be saved."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tap/api/v3/tools/logs-insights/log-groups:
    get:
      tags:
        - Tools
      summary: Get the Logs Insights log groups
      description: "Returns the CloudWatch Logs log groups that a Logs Insights query
        can target, the TAP server and Endpoint server log groups, and the deployment's
        Shard ID. Requires the admin role."
      operationId: getLogsInsightsLogGroups
      responses:
        "200":
          description: The log groups and Shard ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogsInsightsLogGroupsResponse"
        "403":
          description: The caller does not have the admin role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "The Logs Insights tool is not enabled (the combine.tap.tools.logsInsights.enable
            Configuration Value, true by default)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The log groups could not be read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tap/api/v3/tools/logs-insights/query:
    post:
      tags:
        - Tools
      summary: Run a Logs Insights query
      description: "Runs a CloudWatch Logs Insights query against the TAP server or
        Endpoint server log group and waits for the results. A limit command with the
        combine.tap.tools.logsInsights.query.limit Configuration Value (default 500)
        is appended to queryString, unless that value is 0 or less. Results are polled
        every combine.tap.tools.logsInsights.poll.iterations.interval milliseconds (default
        500), at most combine.tap.tools.logsInsights.poll.iterations times (default
        60) and for at most combine.tap.tools.logsInsights.poll.totalDuration.limit
        milliseconds (default 30,000). A query that has not finished by then is stopped,
        and the results it had so far are returned with status Scheduled or Running.
        Requires the admin role."
      operationId: runLogsInsightsQuery
      security:
        - mutualTLS: []
          xRequestedBy: []
      requestBody:
        description: The query to run.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogsInsightsQueryRequest"
        required: true
      responses:
        "200":
          description: The query results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogsInsightsQueryResponse"
        "400":
          description: "queryString or logGroupName is missing or blank, logGroupName
            is not the TAP server or Endpoint server log group, or CloudWatch Logs rejected
            the query or its parameters; the message then includes the AWS error message."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller does not have the admin role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "The Logs Insights tool is not enabled (the combine.tap.tools.logsInsights.enable
            Configuration Value, true by default)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many Logs Insights queries are already running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "The query could not be run, including when queryString or
            logGroupName is not a string."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: "The query ended with status Failed, Cancelled, Timeout, or
            Unknown."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tap/api/v3/tools/iam-user-credentials:
    post:
      tags:
        - Tools
      summary: Register IAM user credentials
      description: "Registers an IAM user's access key with Combine, so that Combine
        can proxy an AWS request signed with that access key as that IAM user. The
        access key and secret access key are first verified by calling AWS STS GetCallerIdentity
        with them. Available to any authenticated user."
      operationId: registerIamUserCredentials
      security:
        - mutualTLS: []
          xRequestedBy: []
      requestBody:
        description: The IAM user access key to register.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IamUserCredentialsRegisterRequest"
        required: true
      responses:
        "200":
          description: The credentials were registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IamUserCredentialsRegisterResponse"
        "400":
          description: "accessKeyId is missing or is not an IAM user access key ID,
            secretAccessKey is missing or blank, or AWS rejected the access key and secret
            access key."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "The IAM user credentials tool is not enabled (the combine.tap.tools.registerIamUserCredentials.enable
            Configuration Value, true by default)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Credentials are already registered for this access key ID and
            overwrite is not true."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "The credentials could not be registered, including when AWS
            STS returned an error other than rejecting the credentials."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tap/api/v3/tools/iam-user-credentials/check:
    post:
      tags:
        - Tools
      summary: Check IAM user credential registration
      description: "Returns whether credentials are registered for an IAM user access
        key ID. Available to any authenticated user."
      operationId: checkIamUserCredentials
      security:
        - mutualTLS: []
          xRequestedBy: []
      requestBody:
        description: The access key ID to check.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IamUserCredentialsCheckRequest"
        required: true
      responses:
        "200":
          description: Whether the credentials are registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IamUserCredentialsCheckResponse"
        "400":
          description: accessKeyId is missing or is not an IAM user access key ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "The IAM user credentials tool is not enabled (the combine.tap.tools.registerIamUserCredentials.enable
            Configuration Value, true by default)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The registration could not be checked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tap/api/v3/users/current:
    get:
      tags:
        - Users
      summary: Get the current user
      description: "Returns the authenticated user making the request. Allowed for every
        role. bundlePath is the stored location of the certificate bundle, not a download
        link; use GET /tap/api/v3/users/{userId}/generateBundleUrl."
      operationId: getCurrentUser
      responses:
        "200":
          description: The current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserCurrentResponseV3"
  /tap/api/v3/users/{userId}:
    get:
      tags:
        - Users
      summary: Get a user
      description: "Returns a user by numeric ID. Allowed for an admin or the user
        themselves. bundlePath is the stored location of the certificate bundle, not a
        download link; use GET /tap/api/v3/users/{userId}/generateBundleUrl."
      operationId: getUser
      parameters:
        - name: userId
          in: path
          description: Numeric identifier of the user.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The requested user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponseV3"
        "400":
          description: The caller has the admin role and the identifier is not a number.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "The caller is neither an admin nor the user, or the user is\
            \ a super_admin and the caller is not."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "No user exists with the given identifier, or the identifier belongs
            to a server."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
        - Users
      summary: Update a user
      description: "Updates a user. Only the fields present in the request body are changed;
        a field sent as null is treated as omitted. Allowed for an admin or the user
        themselves; only an admin may change userRole, active, commonName, or awsRoles (a
        non-admin may send them unchanged). An AWS role id the user does not already have
        must belong to an existing AWS role. Group memberships are updated when fullName,
        email, or userRole changes. Changing commonName or fullName does not issue a new
        certificate; use POST /tap/api/v3/users/{userId}/certificate. Certificate files are
        stored under a name derived from fullName, so after fullName changes, download links
        point to a bundle that does not exist and POST
        /tap/api/v3/users/{userId}/certificate/bundle builds a bundle without the user's
        certificate until the certificate is rebuilt. bundlePath in the response is the
        stored location of the certificate bundle, not a download link."
      operationId: updateUser
      security:
        - mutualTLS: []
          xRequestedBy: []
      parameters:
        - name: userId
          in: path
          description: Identifier of the user.
          required: true
          schema:
            type: string
      requestBody:
        description: Fields to change. Omitted fields are left unchanged.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateRequestV3"
        required: true
      responses:
        "200":
          description: "The result of the update. When the change could not be saved,
            success is false and data is absent; this includes a userRole that is not
            exactly user, admin, or super_admin."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserUpdateResponseV3"
        "400":
          description: "The caller has the admin role and the identifier is not a number,
            awsRoles is not a list of AWS role ids (for example, it contains an AWS role
            object), awsRoles adds an AWS role id that does not exist, or the email is
            already used by another user. Emails are compared without regard to case."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "The caller is not allowed to make this change: the caller\
            \ is neither an admin nor the user, a non-admin tried to change an admin-only\
            \ field, the caller tried to assign or modify a super_admin without being one,\
            \ or reactivating the user would exceed the account user limit."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "No user exists with the given identifier, or the identifier belongs
            to a server."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "Email domain validation is on and the email domain is not allowed.
            The submitted email is checked, or the stored email when email is omitted; the
            check is skipped when active changes and fullName, email, userRole, and the AWS
            role ids do not."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "The user could not be updated, including when the request body is
            not a JSON object or a field has the wrong type."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
        - Users
      summary: Delete a user
      description: "Deletes a user and removes their group memberships, certificate files,
        and certificate bundle. Files stored under an earlier fullName may not be removed.
        Requires the admin role."
      operationId: doDelete
      security:
        - mutualTLS: []
          xRequestedBy: []
      parameters:
        - name: userId
          in: path
          description: Identifier of the user.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The user was deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: "The identifier is not a number, or the user could not be deleted."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "The caller does not have the admin role, or the target user\
            \ is a super_admin and the caller is not."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "No user exists with the given identifier, or the identifier belongs
            to a server."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The user could not be deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tap/api/v3/users/{userId}/generateBundleUrl:
    get:
      tags:
        - Users
      summary: Get a certificate bundle download link
      description: "Returns a presigned URL, valid for 12 hours by default, for downloading
        the user's certificate bundle. The link is generated without checking that the
        bundle exists. Allowed for an admin or the user themselves."
      operationId: generateBundleUrl
      parameters:
        - name: userId
          in: path
          description: Identifier of the user.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: A presigned download link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BundleUrlResponse"
        "400":
          description: The caller has the admin role and the identifier is not a number.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "The caller is neither an admin nor the user, or the user is\
            \ a super_admin and the caller is not."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "No user exists with the given identifier, or the identifier belongs
            to a server."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The certificate bundle download link could not be generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tap/api/v3/users/{userId}/certificate:
    post:
      tags:
        - Users
      summary: Rebuild a user certificate
      description: "Issues the user a new certificate with a new key pair and password,
        and rebuilds the certificate bundle. No email is sent. Requires the admin role."
      operationId: rebuildCertificate
      security:
        - mutualTLS: []
          xRequestedBy: []
      parameters:
