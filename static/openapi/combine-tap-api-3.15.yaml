            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tap/api/v3/config/application/item:
    put:
      tags:
        - Configuration
      summary: Update an application configuration item
      description: "Writes a single configuration value by name. Any configuration
        value name is accepted except a Managed Configuration Value, such as a value
        set by the deployment's CloudFormation template or by PUT /tap/api/v3/config/application,
        which is rejected with 403. Requires the admin role."
      operationId: updateApplicationConfigurationItem
      security:
        - mutualTLS: []
          xRequestedBy: []
      requestBody:
        description: The configuration item to set.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigurationItemRequest"
        required: true
      responses:
        "200":
          description: The configuration item was updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "403":
          description: "The caller does not have the admin role, or the named configuration
            value is a Managed Configuration Value."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "The configuration item could not be updated, including when
            the body is not a JSON object or parameter_name or parameter_value is missing
            or null."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tap/api/v3/partitions/getActivePartition:
    get:
      tags:
        - Configuration
      summary: Get the active partition
      description: "Returns the emulated partition that is active in this deployment,\
        \ named by the combine.partitions.active configuration value. Returns an empty\
        \ object when that value does not name a defined partition. Available to any\
        \ authenticated user."
      operationId: getActivePartition
      responses:
        "200":
          description: The active cloud partition.
