                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
        - Users
      summary: Update a user (v1)
      description: "Deprecated; use PUT /tap/api/v3/users/{userId}. Differs from v3 in
        awsRoles and bundlePath: the request accepts AWS role objects, of which only id is
        read, as well as AWS role ids; the response lists AWS role objects; and a non-empty
        bundlePath in the response is replaced with a presigned download link valid for 12
        hours by default, or left as the stored location when the link cannot be generated.
        Updates a user. Only the fields present in the request body are changed; a field
