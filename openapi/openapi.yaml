            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The API configuration could not be retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tap/api/v1/metadata/api-handler-status:
    get:
      tags:
        - Metadata
      summary: Get API handler configuration
      description: "Returns the AWS API rewriters and filters loaded by the Endpoint
        Server and their enablement configuration. Available to any authenticated
        caller when application metadata is enabled."
      operationId: getRewriterFilterStatus
      responses:
        "200":
          description: The API handler configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiHandlerStatus"
        "404":
          description: Application metadata is not enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The API handler configuration could not be retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tap/api/v1/reference-data/{id}:
    get:
      tags:
        - Metadata
      summary: Get reference data
      description: Returns the reference data stored under the given identifier.
      operationId: getReferenceData
      parameters:
        - name: id
          in: path
          description: Identifier of the reference data.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "The reference data text (JSON or Markdown, per the referring
            Alert Event field's referenceDataType)."
          content:
