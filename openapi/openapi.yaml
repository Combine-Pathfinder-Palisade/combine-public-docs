      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        fullName:
          type: string
        active:
          type: boolean
        userRole:
          type: string
          enum:
            - user
            - admin
            - super_admin
        lastLoginDate:
          type: string
        lastConsoleLoginDate:
          type: string
        hasBundle:
          type: boolean
          description: Whether a certificate bundle location is recorded for the user.
    UserListResponseV1:
      type: object
