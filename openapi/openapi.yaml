components:
  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
    AlertEvent:
      type: object
      properties:
        id:
          type: string
        count:
          type: integer
          format: int64
        date:
          type: string
        dateExpires:
          type: string
        message:
          $ref: "#/components/schemas/Message"
        state:
          type: string
    Field:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
        referenceDataId:
          type: string
        referenceDataType:
          type: string
    Message:
      type: object
      properties:
        type:
          type: string
        summary:
          type: string
        fields:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Field"
        lastSeen:
          type: string
        lastSeenFields:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Field"
    AlertEventResponse:
      type: object
      description: The requested alert event.
      properties:
        data:
          $ref: "#/components/schemas/AlertEvent"
    AlertEventListResponse:
      type: object
      description: A list of alert events.
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AlertEvent"
    CapAccessListEntry:
      type: object
      description: "An account the caller may access, with its available roles."
      properties:
        account_number:
          type: string
          description: AWS account number.
          example: "123456789012"
        agency:
          type: string
          description: Agency the account belongs to.
          example: EXAMPLE
        mission:
          type: string
          description: Mission the account belongs to.
          example: Example Mission
        roles:
          type: array
          description: Roles the caller may assume within the account.
          items:
            $ref: "#/components/schemas/CapAccessRole"
    CapAccessRole:
      type: object
      description: A role the caller may assume within an account.
      properties:
        role_name:
          type: string
          description: Name of the role.
          example: PowerUser
        favorite:
          type: boolean
          description: Whether the caller has marked this role as a favorite.
          example: false
        granted_by:
          type: string
          description: Identifier of the entitlement that granted this role.
          example: C2S-EXAMPLE-MSN-POWERUSER
        account_session_duration_seconds:
          type: integer
          format: int32
          description: "Maximum session duration allowed for this account, in seconds."
          example: 3600
        user_session_duration_seconds:
          type: integer
          format: int32
          description: "Session duration configured for the user, in seconds."
        last_access:
          type: string
          description: "Time the caller last accessed this role, in UTC. Null when\
            \ never accessed."
          example: 2026-07-06T12:34:56Z
    CapStatusResponse:
      type: object
      description: An error result carrying an HTTP status code and a message.
      properties:
        status:
          type: integer
          format: int32
          description: HTTP status code of the error.
          example: 400
        message:
          type: string
          description: Human-readable description of the error.
          example: "Missing parameter [agency]!"
      required:
        - message
        - status
    AssumedRoleUser:
      type: object
      description: Identifiers of the assumed role session.
      properties:
        AssumedRoleId:
          type: string
          description: Unique identifier of the assumed role session.
          example: AROAEXAMPLEID:session
        Arn:
          type: string
          description: Amazon Resource Name of the assumed role session.
          example: arn:aws:sts::123456789012:assumed-role/ExampleRole/session
      required:
        - Arn
        - AssumedRoleId
    AwsCredentials:
      type: object
      description: Temporary AWS security credentials for the assumed role.
      properties:
        AccessKeyId:
          type: string
          description: AWS access key ID.
          example: ASIAIOSFODNN7EXAMPLE
        SecretAccessKey:
          type: string
          description: AWS secret access key.
          example: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
        SessionToken:
          type: string
          description: AWS session token for the temporary credentials.
          example: FQoGZXIvYXdzEExampleSessionTokenABC123
        Expiration:
          type: string
          description: "Expiration time of the credentials, in UTC."
          example: 2026-07-06T12:34:56Z
      required:
        - AccessKeyId
        - Expiration
        - SecretAccessKey
        - SessionToken
    CredentialsResponse:
      type: object
      description: Temporary AWS credentials and the assumed role session.
      properties:
        Credentials:
          $ref: "#/components/schemas/AwsCredentials"
        AssumedRoleUser:
          $ref: "#/components/schemas/AssumedRoleUser"
      required:
        - AssumedRoleUser
        - Credentials
    CapTrailSummary:
      type: object
      description: A summary of a user's access to an account.
      properties:
        user:
          $ref: "#/components/schemas/CapTrailSummaryUser"
        account:
          $ref: "#/components/schemas/CapTrailSummaryAccount"
        userRole:
          type: string
          description: Role the user assumed.
          example: PowerUser
        last_access:
          type: string
          description: "Time of the most recent access, in UTC."
          example: 2026-07-06T12:34:56Z
        cnt_total:
          type: string
          description: "Total number of access events, as a string."
          example: "42"
    CapTrailSummaryAccount:
      type: object
      description: The account associated with an activity summary.
      properties:
        account_number:
          type: string
          description: AWS account number.
          example: "123456789012"
        agency:
          type: string
          description: Agency the account belongs to.
          example: EXAMPLE
        mission:
          type: string
          description: Mission the account belongs to.
          example: Example Mission
    CapTrailSummaryUser:
      type: object
      description: The user associated with an activity summary.
      properties:
        client_dn:
          type: string
          description: Distinguished name from the client certificate.
          example: "CN=Jane Doe,OU=Example,O=Combine"
        iaa_dn:
          type: string
          description: Distinguished name of the issuing authority.
          example: "CN=Example CA,O=Combine"
        org:
          type: string
          description: Organization the activity is attributed to.
          example: Combine
    CapTrailEvent:
      type: object
      description: A single AWS access trail event.
      properties:
        version:
          type: string
          description: Schema version of the event.
          example: "1.00"
        id:
          type: string
          description: Unique identifier of the event.
          example: 3f2504e0-4f89-41d3-9a0c-0305e82c3301
        at:
          type: string
          description: "Time the event occurred, in UTC."
          example: 2026-07-06T12:34:56Z
        client_dn:
          type: string
          description: Distinguished name from the client certificate.
          example: "CN=Jane Doe,OU=Example,O=Combine"
        iaa_dn:
          type: string
          description: Distinguished name of the issuing authority.
          example: "CN=Example CA,O=Combine"
        accountNumber:
          type: string
          description: AWS account number the access targeted.
          example: "123456789012"
        environment:
          type: string
          description: Cloud environment the access targeted.
          example: AWS_C2S
        request:
          $ref: "#/components/schemas/CapTrailEventRequest"
        credentials:
          $ref: "#/components/schemas/CapTrailEventCredentials"
    CapTrailEventCredentials:
      type: object
      description: The credentials issued for a trail event.
      properties:
        arn:
          type: string
          description: Amazon Resource Name of the assumed role session.
          example: arn:aws:sts::123456789012:assumed-role/ExampleRole/session
        role_id:
          type: string
          description: Identifier of the assumed role.
          example: AROAEXAMPLEID
        key_id:
          type: string
          description: Access key ID of the issued credentials.
          example: ASIAIOSFODNN7EXAMPLE
        expiration:
          type: string
          description: "Expiration time of the issued credentials, in UTC."
          example: 2026-07-06T12:34:56Z
    CapTrailEventRequest:
      type: object
      description: The access request that produced a trail event.
      properties:
        agency:
          type: string
          description: Agency the request targeted.
          example: EXAMPLE
        mission:
          type: string
          description: Mission the request targeted.
          example: Example Mission
        userRole:
          type: string
          description: Role the request assumed.
          example: PowerUser
    ScapAccessGroup:
      type: object
      description: "An account the caller may access, with its available roles."
      properties:
        agency:
          type: string
          description: Agency the account belongs to.
          example: EXAMPLE
        accountName:
          type: string
          description: Name of the account.
          example: Example Account
        accountNumber:
          type: string
          description: AWS account number.
          example: "123456789012"
        roles:
          type: array
          description: Roles the caller may assume within the account.
          items:
            $ref: "#/components/schemas/ScapAccessRole"
    ScapAccessListResponse:
      type: object
      description: The accounts and roles the caller may access.
      properties:
        gxCAPAccessList:
          type: array
          description: The accounts the caller may access.
          items:
            $ref: "#/components/schemas/ScapAccessGroup"
    ScapAccessRole:
      type: object
      description: A role the caller may assume within an account.
      properties:
        roleName:
          type: string
          description: Name of the role.
          example: PowerUser
    MassEmailRequest:
      type: object
      description: The recipients and content of a mass email.
      properties:
        includeAllUsers:
          type: boolean
          description: Whether to send the email to all users.
          example: true
        includeNPE:
          type: boolean
          description: Whether to include non-person entities among the recipients.
          example: false
        subject:
          type: string
          description: Subject line of the email.
          example: Scheduled maintenance
        body:
          type: string
          description: Body of the email.
          example: The system will be unavailable on Saturday.
    AwsRole:
      type: object
      properties:
        id:
          type: integer
          format: int64
        environment:
          type: string
        defaultRole:
          type: boolean
        account:
          $ref: "#/components/schemas/AwsRolePair"
        agency:
          $ref: "#/components/schemas/AwsRolePair"
        role:
          $ref: "#/components/schemas/AwsRolePair"
    AwsRoleListResponse:
      type: object
      description: A list of AWS roles.
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AwsRole"
    AwsRolePair:
      type: object
      properties:
        value:
          type: string
        valueAlias:
          type: string
        valueDescription:
          type: string
        empty:
          type: boolean
    AwsRoleResponse:
      type: object
      description: The requested AWS role.
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/AwsRole"
    AwsRoleDeleteResponse:
      type: object
      description: Confirmation that an AWS role was deleted.
      properties:
        success:
          type: boolean
        data:
          type: string
          example: Role Deleted
    ApplicationConfiguration:
      type: object
      properties:
        awsAccountId:
          type: string
        customerName:
          type: string
        userLimit:
          type: integer
          format: int32
