          description: New full name.
          example: Jane Doe
        email:
          type: string
          description: New email address.
          example: jane.doe@example.com
        active:
          type: boolean
          description: Whether the user is active.
          example: true
        userRole:
          type: string
          description: New role for the user. Admin only; only a super_admin may assign
            super_admin.
          enum:
            - user
            - admin
            - super_admin
