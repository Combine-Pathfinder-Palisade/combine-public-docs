        required: true
      responses:
        "200":
          description: The created user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserCreateResponse"
        "400":
          description: "The request body is malformed, the full name or email is missing,\
            \ the user role is blank or invalid, the email is already used by another user\
            \ (compared without regard to case), or the user could not be saved."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
