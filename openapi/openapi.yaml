          example: 10
  parameters:
    PageSize:
      name: pageSize
      in: query
      description: "Number of results per page, from 1 to 100. Defaults to 25 when another\
        \ paging parameter is sent."
      schema:
        type: integer
        minimum: 1
        maximum: 100
    Page:
      name: page
      in: query
      description: Zero-based page number. Takes precedence over nextToken.
      schema:
        type: integer
        minimum: 0
    NextToken:
      name: nextToken
      in: query
      description: "The nextToken returned by the previous page. It must be sent with\
        \ the same q and active values."
      schema:
        type: string
    Query:
      name: q
      in: query
      description: "Returns only results whose name or email contains this value, ignoring\
        \ case. Up to 200 characters."
      schema:
        type: string
        maxLength: 200
  securitySchemes:
    mutualTLS:
      type: mutualTLS
      description: "Authenticates the caller with an X.509 client certificate issued\
        \ by the deployment. Combine identifies the caller's user account from the\
        \ certificate's serial number, and that account's role determines what the\
        \ caller can access."
    xRequestedBy:
      type: apiKey
      description: "Required on requests that change data, which is every method except\
        \ GET and HEAD. Combine only checks that the header is present and accepts any\
        \ value; a request without it is rejected with 400 and an empty body. The health\
        \ check and OCSP endpoints are exempt, and a CORS preflight OPTIONS request is\
        \ answered without it when CORS is enabled."
      name: X-Requested-By
      in: header
