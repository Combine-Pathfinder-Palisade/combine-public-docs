            type: string
      responses:
        "200":
          description: The user's groups.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupListResponse"
        "403":
          description: The caller is neither an admin nor the user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tap/api/v1/groups/me:
    get:
      tags:
        - Groups
      summary: List my groups
      description: "Returns the groups the authenticated user belongs to, sorted by
        name (ignoring case)."
      operationId: getMyGroups
      responses:
        "200":
          description: The caller's groups.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupListResponse"
  /tap/api/v1/metadata/all-configurations:
    get:
