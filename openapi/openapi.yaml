          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No user exists with the given identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
        - Users
      summary: Update a user
      description: "Updates a user. Only the fields present in the request body are
        changed; a field sent as null is treated as omitted. Allowed for an admin or
        the user themselves; only an admin may change userRole, active, commonName,
        or awsRoles (a non-admin may send them unchanged). Group memberships are updated
