              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tap/api/v2/servers:
    get:
      tags:
        - Servers
      summary: List servers (v2)
      description: "Returns a summary of each server. The complete server is available
        from GET /tap/api/v2/servers/{serverId}. Requires the admin role; a caller with
        the user role receives an empty list. A single page is returned when pageSize,
        page, nextToken, or q is not blank, or when active or includeCounts is true;
        otherwise every server is returned, sorted by fullName. A page is sorted by
        fullName, ignoring case and surrounding whitespace, then by id."
      operationId: getAllServersV2
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/NextToken"
        - $ref: "#/components/parameters/Query"
        - name: active
          in: query
          description: "When true, returns only active servers."
          schema:
            type: boolean
        - name: includeCounts
          in: query
          description: "When true, the response also includes serverCount and serverCountActive.
            This also selects a single page."
          schema:
            type: boolean
      responses:
        "200":
          description: All servers or a single page of servers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerListResponse"
        "400":
          description: "A paging parameter is invalid: pageSize or page is not a whole\
            \ number, pageSize is outside 1 to 100, page is negative, q is longer than\
            \ 200 characters, or nextToken is malformed or was issued for a different q\
            \ or active value."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller has neither the admin nor the user role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - Servers
      summary: Create a server (v2)
      description: "Creates a server and issues its certificate. When csr is not blank,
        the CSR is signed and the certificate bundle contains no private key; otherwise
        a key pair and password are generated. The default AWS roles are assigned when
        awsRoles is omitted or empty. Requires the admin role. When the sendWelcomeEmail
        setting is on and email integration is enabled, the custodian is sent an email;
        it includes a download link valid for up to 8 hours when the showBundleLinks
        setting is on, and attaches the bundle when the sendWelcomeEmailWithAttachment
        setting is on. If the download link cannot be generated, the server is still
        created but no email is sent, and POST /tap/api/v2/servers/{serverId}/resend
        can send it later. bundlePath in the response is the stored location of the certificate bundle, not a download link."
      operationId: createServerV2
      security:
        - mutualTLS: []
          xRequestedBy: []
      requestBody:
        description: Server to create.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServerCreateRequest"
        required: true
      responses:
        "200":
          description: The created server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerCreateResponse"
        "400":
          description: "The request body is malformed, the name, custodian email, or
            custodian name is missing or blank, or the server could not be saved."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller does not have the admin role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Email domain validation is on and the email domain is not allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "The server could not be created, or the server was created but
            a later step failed. When the certificate could not be generated, the server
            exists without a certificate until POST /tap/api/v2/servers/{serverId}/certificate
            is called."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
    AlertEvent:
      type: object
      properties:
        id:
          type: string
        count:
          type: integer
          format: int64
        date:
          type: string
        dateExpires:
          type: string
        message:
          $ref: "#/components/schemas/Message"
        state:
          type: string
          description: State of the alert event, either open or ignored.
    Field:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
        referenceDataId:
          type: string
        referenceDataType:
          type: string
    Message:
      type: object
      properties:
        type:
          type: string
        summary:
          type: string
        fields:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Field"
        lastSeen:
          type: string
        lastSeenFields:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Field"
    AlertEventResponse:
      type: object
      description: The requested alert event.
      properties:
        data:
          $ref: "#/components/schemas/AlertEvent"
    AlertEventListResponse:
      type: object
      description: A list of alert events.
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AlertEvent"
    AssumedRoleUser:
      type: object
      description: Identifiers of the assumed role session.
      properties:
        AssumedRoleId:
          type: string
          description: Unique identifier of the assumed role session.
          example: AROAEXAMPLEID:session
        Arn:
          type: string
          description: Amazon Resource Name of the assumed role session.
          example: arn:aws:sts::123456789012:assumed-role/ExampleRole/session
      required:
        - Arn
        - AssumedRoleId
    AwsCredentials:
      type: object
      description: Temporary AWS security credentials for the assumed role.
      properties:
        AccessKeyId:
          type: string
          description: AWS access key ID.
          example: ASIAIOSFODNN7EXAMPLE
        SecretAccessKey:
          type: string
          description: AWS secret access key.
          example: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
        SessionToken:
          type: string
          description: AWS session token for the temporary credentials.
          example: FQoGZXIvYXdzEExampleSessionTokenABC123
        Expiration:
          type: string
          description: "Expiration time of the credentials, in UTC."
          example: "2026-07-06T12:34:56Z"
      required:
        - AccessKeyId
        - Expiration
        - SecretAccessKey
        - SessionToken
    CredentialsResponse:
      type: object
      description: Temporary AWS credentials and the assumed role session.
      properties:
        Credentials:
          $ref: "#/components/schemas/AwsCredentials"
        AssumedRoleUser:
          $ref: "#/components/schemas/AssumedRoleUser"
      required:
        - AssumedRoleUser
        - Credentials
    MassEmailRequest:
      type: object
      description: The recipients and content of a mass email.
      properties:
        includeAllUsers:
          type: boolean
          description: "When true, include inactive users as well as active users; when
            false, only active users."
          example: true
        includeNPE:
          type: boolean
          description: "When true, also include server (non-person entity) accounts.
            When includeAllUsers is false, servers are included whether or not they are
            active."
          example: false
        subject:
          type: string
          description: Subject line of the email.
          example: Scheduled maintenance
        body:
          type: string
          description: Body of the email, sent as HTML; each newline is converted to
            <br/>.
          example: The system will be unavailable on Saturday.
      required:
        - body
        - includeAllUsers
        - includeNPE
        - subject
    AwsRole:
      type: object
      properties:
        id:
          type: integer
          format: int64
        environment:
          type: string
          description: "Identifier of the cloud partition the role belongs to, such\
            \ as AWS_C2S, AWS_SC2S, or AWS_GOV_CLOUD."
          example: AWS_C2S
        defaultRole:
          type: boolean
          description: Whether the role is assigned to new users and servers that are
            created without any AWS roles.
        account:
          $ref: "#/components/schemas/AwsRolePair"
          description: "The AWS account. value is the account number; valueAlias is\
            \ the account (mission) name used by the CAP, SCAP, and login endpoints."
        agency:
          $ref: "#/components/schemas/AwsRolePair"
          description: "The agency. valueAlias is the agency name used by the CAP,\
            \ SCAP, and login endpoints. Defaults to Combine when omitted."
        role:
          $ref: "#/components/schemas/AwsRolePair"
          description: "The IAM role. value is the IAM role name that is assumed; valueAlias\
            \ is the role name used by the CAP, SCAP, and login endpoints."
    AwsRoleRequest:
      type: object
      description: "AWS role values accepted when creating or updating an AWS role.
        An id in the request body is ignored: the server assigns it on create, and
        update uses the path identifier."
      properties:
        environment:
          type: string
          description: "Identifier of an emulated AWS partition defined for the deployment,
            matched case-sensitively, such as AWS_C2S, AWS_SC2S, or AWS_GOV_CLOUD."
          example: AWS_C2S
        defaultRole:
          type: boolean
          description: "Whether the role is assigned to new users and servers that
            are created without any AWS roles. Defaults to false on create; on update
            it is changed only when present."
        account:
          $ref: "#/components/schemas/AwsRolePair"
          description: "The AWS account. value (the account number) and valueAlias
            (the account (mission) name) must not be blank."
        agency:
          $ref: "#/components/schemas/AwsRolePair"
          description: "The agency. When provided, value and valueAlias must not be
            blank. When omitted, value and valueAlias are set to Combine."
        role:
          $ref: "#/components/schemas/AwsRolePair"
          description: "The IAM role. value (the IAM role name that is assumed) and
            valueAlias (the role name) must not be blank."
      required:
        - environment
        - account
        - role
    AwsRoleListResponse:
      type: object
      description: A list of AWS roles.
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AwsRole"
    AwsRolePair:
      type: object
      properties:
        value:
          type: string
        valueAlias:
          type: string
        valueDescription:
          type: string
        empty:
          type: boolean
          readOnly: true
          description: Whether value or valueAlias is blank. Computed; ignored on input.
    AwsRoleResponse:
      type: object
      description: The requested AWS role.
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/AwsRole"
    AwsRoleDeleteResponse:
      type: object
      description: Confirmation that an AWS role was deleted.
      properties:
        success:
          type: boolean
        data:
          type: string
          example: Role Deleted
    ApplicationConfiguration:
      type: object
      properties:
        awsAccountId:
          type: string
        customerName:
          type: string
        userLimit:
          type: integer
          format: int32
        userValidateEmailDomain:
          type: boolean
        userValidateEmailDomainWhitelist:
          type: string
        userDaysInactiveThreshold:
          type: integer
          format: int32
        sendWelcomeEmail:
          type: boolean
        sendWelcomeEmailWithAttachment:
          type: boolean
        hasUserManagementAccount:
          type: boolean
        showBundleLinks:
          type: boolean
        enableResourceRoleMasquerade:
          type: boolean
        enableAwsApiLogging:
          type: boolean
        endpointCAP:
          type: string
        endpointSCAP:
          type: string
        enableOCSP:
          type: boolean
        certificateKeySize:
          type: string
        certificateHashAlgorithm:
          type: string
        cors:
          type: boolean
        corsAccessControlAllowOrigin:
          type: string
        corsAccessControlAllowMethods:
          type: string
        corsAccessControlAllowHeaders:
          type: string
        corsReferrerPolicy:
          type: string
        corsAccessControlAllowCredentials:
          type: boolean
        enableToolAnalyzeCloudFormationTemplate:
          type: boolean
        enableToolFirewallRules:
          type: boolean
        enableToolWorkloadHealth:
          type: boolean
        enableApplicationMetadata:
          type: boolean
    ApplicationConfigurationResponse:
      type: object
      description: The application configuration.
      properties:
        data:
          $ref: "#/components/schemas/ApplicationConfiguration"
    EmailIntegrationResponse:
      type: object
      description: Whether email integration is enabled.
      properties:
        emailIntegrationEnabled:
          type: boolean
          description: Whether email integration is enabled.
          example: true
    ApplicationConfigurationUpdateResponse:
      type: object
      description: The updated application configuration.
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/ApplicationConfiguration"
    ConfigurationItemRequest:
      type: object
      description: A single application configuration item to set.
      properties:
        parameter_name:
          type: string
          description: Name of the configuration item.
          example: combine.tap.api.cap.enable
        parameter_value:
          type: string
          description: New value for the configuration item.
          example: "true"
      required:
        - parameter_name
        - parameter_value
    Partition:
      type: object
      description: A cloud partition and its regions.
      properties:
        id:
          type: string
          description: Identifier of the partition.
          example: AWS_GOV_CLOUD
        displayName:
          type: string
          description: Display name of the partition.
          example: AWS US GovCloud Regions
        rootRegionId:
          type: string
          description: Identifier of the partition's root region.
          example: us-gov-west-1
        regions:
          type: array
          description: Identifiers of the regions in the partition, in no guaranteed
            order.
          items:
            type: string
    DashboardMetadataResponse:
      type: object
      description: Metadata for the administrator dashboard.
      properties:
        version:
          type: string
          description: Version of the application.
          example: 3.14.9.4
        userCountActive:
          type: integer
          format: int32
          description: Number of active users that count toward the user limit (super_admin
            users and servers are not counted).
          example: 42
        lastUserLogin:
          type:
            - string
            - "null"
          description: "Most recent date, as YYYY-MM-DD in UTC, on which any user (servers
            excluded) obtained AWS credentials through the CAP, SCAP, or AWS console login
            endpoints. TAP Dashboard and TAP API access is not counted. Null when no user
            has done so."
          example: "2026-07-06"
    CertificateExpirationResponse:
      type: object
      description: The expiration dates of the certificate authority certificates.
      properties:
        expirationCASigner:
          type:
            - string
            - "null"
          description: Expiration date of the signer certificate authority, in UTC.
            Null when the certificate could not be read.
          example: Mon, 6 Jul 2026 12:00:00
        expirationCA:
          type:
            - string
            - "null"
          description: Expiration date of the root certificate authority, in UTC. Null
            when the certificate could not be read.
          example: Mon, 6 Jul 2026 12:00:00
    SupportedServiceNames:
      type: object
      description: The supported VPC endpoint service names for a region.
      properties:
        region:
          type: string
          description: The region the service names apply to.
          example: us-iso-east-1
        supported_service_names:
          type: array
          description: Supported VPC endpoint service names.
          items:
            type: string
    SupportedInstanceTypes:
      type: object
      description: The supported instance types for a service in an environment.
      properties:
        key:
          type: string
          description: The service and environment the instance types apply to.
          example: ec2.aws_c2s
        supported_instance_types:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: "Supported instance types grouped by instance family (for example
            m5). A wildcard entry such as m5.* is returned as the string \"All Types
            Supported\"."
    SupportedEksClusterVersions:
      type: object
      description: The supported EKS cluster versions for an environment.
      properties:
        environment:
          type: string
          description: Identifier of the cloud partition.
          example: AWS_C2S
        supported_eks_cluster_versions:
          type: array
          description: Supported EKS cluster versions.
          items:
            type: string
    SupportedRdsEngineVersions:
      type: object
      description: The supported RDS engine versions for an engine in an environment.
      properties:
        environment:
          type: string
          description: Identifier of the cloud partition.
          example: AWS_C2S
        engine:
          type: string
          description: The RDS database engine.
          example: mysql
        supported_rds_engine_versions:
          type: array
          description: Supported versions of the engine.
          items:
            type: string
    Group:
      type: object
      properties:
        pk:
          type: string
        sk:
          type: string
        groupId:
          type: string
        name:
          type: string
        description:
          type: string
        accountIds:
          type: array
          items:
            type: string
        cidrBlocks:
          type: array
          items:
            type: string
        vpcIds:
          type: array
          items:
            type: string
        createdDate:
          type: string
        updatedDate:
          type: string
    GroupResponse:
      type: object
      description: The requested group.
      properties:
        success:
          type: boolean
          description: Always true for a successful response.
          example: true
        data:
          $ref: "#/components/schemas/Group"
      required:
        - success
    GroupCreateRequest:
      type: object
      description: Fields accepted when creating a group.
      properties:
        name:
          type: string
          description: Display name of the group.
          example: Example Group
        description:
          type: string
          description: Optional free-text description.
          example: Example group description
        accountIds:
          type: array
          description: AWS account IDs associated with the group.
          items:
            type: string
        cidrBlocks:
          type: array
          description: CIDR blocks associated with the group.
          items:
            type: string
        vpcIds:
          type: array
          description: VPC IDs associated with the group.
          items:
            type: string
      required:
        - name
    MessageResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
    GroupListResponse:
      type: object
      description: A list of groups.
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Group"
    GroupUpdateRequest:
      type: object
      description: Fields to change on a group; only the fields present are updated.
      properties:
        name:
          type: string
          description: "New display name. If provided, must not be blank."
          example: Example Group
        description:
          type: string
          description: New free-text description.
          example: Example group description
        accountIds:
          type: array
          description: Replacement list of AWS account IDs.
          items:
            type: string
        cidrBlocks:
          type: array
          description: Replacement list of CIDR blocks.
          items:
            type: string
        vpcIds:
          type: array
          description: Replacement list of VPC IDs.
          items:
            type: string
    AddMembersResponse:
      type: object
      description: The memberships that were added.
      properties:
        success:
          type: boolean
          description: Always true for a successful response.
          example: true
        data:
          type: array
          description: The memberships that were added. Users already in the group
            are not included.
          items:
            $ref: "#/components/schemas/GroupMembership"
        message:
          type: string
          description: A message summarizing how many members were added.
          example: 2 member(s) added.
      required:
        - success
    GroupMembership:
      type: object
      properties:
        pk:
          type: string
        sk:
          type: string
        dateJoined:
          type: string
        fullName:
          type: string
        email:
          type: string
        userRole:
          type: string
        userId:
          type: string
        groupId:
          type: string
    AddMembersRequest:
      type: object
      description: "Users to add to a group. Provide userId or userIds; when both
        are present, userId is used and userIds is ignored. Each ID is a decimal user
        ID, sent as a JSON string or number."
      properties:
        userId:
          type: string
          description: "Single user ID to add. Takes precedence over userIds."
          example: "1042"
        userIds:
          type: array
          description: Multiple user IDs to add. Ignored when userId is present. Must
            not be empty.
          items:
            type: string
    GroupMembershipListResponse:
      type: object
      description: A list of group memberships.
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/GroupMembership"
    CloudFormationTemplateRequest:
      type: object
      description: The CloudFormation template to analyze and the environment to analyze
        it against.
      properties:
        file:
          type: string
          format: binary
          description: "The CloudFormation template file. The format is chosen by the
            file name, which must end in yaml, yml, or json (case-sensitive)."
        environment:
          type: string
          description: "Identifier of the cloud partition to analyze the template against,\
            \ such as AWS_C2S, AWS_SC2S, or AWS_GOV_CLOUD."
          example: AWS_GOV_CLOUD
        region:
          type: string
          description: "Region to analyze the template against. When omitted, or not
            a region of the environment, one of the environment's regions is used."
          example: us-gov-west-1
        partitionRef:
          type: string
          description: "Text that replaces a hard-coded partition in an ARN in each
            finding's expectedValue. Defaults to ${AWS::Partition} when omitted or empty."
        regionRef:
          type: string
          description: "Text that replaces a hard-coded region in an ARN in each finding's
            expectedValue. Defaults to ${AWS::Region} when omitted or empty."
      required:
        - environment
        - file
    HighlightRange:
      type: object
      properties:
        start:
          type: integer
          format: int32
        end:
          type: integer
          format: int32
    TemplateAnalysisFinding:
      type: object
      properties:
        finding:
          type: string
        findingRemediation:
          type: string
        level:
          type: string
          enum:
            - ERROR
            - WARNING
            - INFO
        breadcrumbPath:
          type: array
          items:
            type: string
        sourceLineNumber:
          type: integer
          format: int32
        sourceColumn:
          type: integer
          format: int32
        observedValue:
          type: string
        observedHighlightRanges:
          type: array
          items:
            $ref: "#/components/schemas/HighlightRange"
        expectedValue:
          type: string
        expectedHighlightRanges:
          type: array
          items:
            $ref: "#/components/schemas/HighlightRange"
    TemplateAnalysisResponse:
      type: object
      description: The findings from analyzing a CloudFormation template.
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/TemplateAnalysisResult"
    TemplateAnalysisResult:
      type: object
      description: "The analysis findings, grouped by resource."
      properties:
        findingCount:
          type: integer
          format: int32
          description: Total number of findings across all resources.
          example: 3
        resourcesWithFindingsCount:
          type: integer
          format: int32
          description: Number of resources that have at least one finding.
          example: 2
        resourceFindings:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/TemplateAnalysisFinding"
    ApiHandlerStatus:
      type: object
      description: The AWS API rewriters and filters loaded by the Endpoint Server.
      properties:
        rewriters:
          type: object
          properties:
            request:
              type: array
              items:
                $ref: "#/components/schemas/ApiHandlerMetadata"
            response:
              type: array
              items:
                $ref: "#/components/schemas/ApiHandlerMetadata"
        filters:
          type: object
          properties:
            request:
              type: array
              items:
                $ref: "#/components/schemas/ApiHandlerMetadata"
    ApiHandlerMetadata:
      type: object
      description: "Configuration of one API handler. List values are comma-separated
        strings, empty when not set. Only request rewriters return the strictMode
        values."
      properties:
        name:
          type: string
        configurationPrefix:
          type: string
        tags:
          type: string
        enabled:
          type: boolean
        disabledByTags:
          type: string
        enabledOnlyForAccounts:
          type: string
        disabledForAccounts:
          type: string
        enabledOnlyForCidrBlocks:
          type: string
        disabledForCidrBlocks:
          type: string
        enabledOnlyForAccountsByTag:
          type: string
        disabledForAccountsByTag:
          type: string
        legacyMode:
          type: boolean
        legacyModeOnlyForAccounts:
          type: string
        legacyModeDisabledForAccounts:
          type: string
        strictModeOverride:
          type: boolean
        strictModeUserAgents:
          type: string
        strictModeUserAgentsExcept:
          type: string
        strictModeAccounts:
          type: string
        strictModeAccountsExcept:
          type: string
    FirewallRulesUpdateResponse:
      type: object
      description: The result of applying custom firewall rules.
      properties:
        success:
          type: boolean
        data:
          type: object
          description: The rule group that was updated.
          properties:
            matchedGroup:
              type: string
              description: Name of the updated firewall rule group.
            ruleGroupArn:
              type: string
              description: ARN of the updated firewall rule group.
            updateToken:
              type: string
              description: Update token returned by AWS Network Firewall.
    FirewallRulesUpdateRequest:
      type: object
      description: The custom firewall rules to apply.
      properties:
        rules:
          type: string
          description: The Suricata rules to apply to the rule group.
        dryRunOption:
          type: string
          description: "Set to the string \"true\" (case-sensitive) to validate the
            update without applying it. Any other value, or omitting it, applies the
            rules."
          example: "true"
      required:
        - rules
    WorkloadHealthUpdateRequest:
      type: object
      description: The workload health configuration to set.
      properties:
        workloadHealthEndpoint:
          type: string
          description: URL of the workload health dashboard.
          example: https://health.example.com
        workloadHealthMarkup:
          type: string
          description: "Custom markup displayed alongside the workload health dashboard.
            When omitted or null, the existing markup is kept; send an empty string
            to clear it."
      required:
        - workloadHealthEndpoint
    FirewallRules:
      type: object
      description: The custom firewall rules and their rule group.
      properties:
        suricataRules:
          type: string
          description: The Suricata rules for the matched rule group.
        matchedGroup:
          type: string
          description: Name of the matched firewall rule group.
        ruleGroupArn:
          type: string
          description: ARN of the matched firewall rule group.
    FirewallRulesResponse:
      type: object
      description: The current custom firewall rules.
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/FirewallRules"
    WorkloadHealth:
      type: object
      description: "The workload health configuration values. Each value is an empty
        string when it has not been set."
      properties:
        workloadHealthEndpoint:
          type: string
          description: URL of the workload health dashboard.
          example: https://health.example.com
        workloadHealthMarkup:
          type: string
          description: Custom markup displayed alongside the workload health dashboard.
        lastUpdateDate:
          type: string
          description: "Time the workload health configuration was last updated, in
            UTC."
          example: "Mon, 6 Jul 2026 12:34:56"
    WorkloadHealthResponse:
      type: object
      description: The workload health configuration.
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/WorkloadHealth"
    User:
      type: object
      properties:
        id:
          type: integer
