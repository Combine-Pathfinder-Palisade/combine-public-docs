          description: New full name.
          example: Example Server
        email:
          type: string
          description: New custodian email address.
          example: custodian@example.com
        active:
          type: boolean
          description: Whether the server is active.
          example: true
        custodianName:
          type: string
          description: New custodian name.
          example: Jane Doe
        domains:
          type: string
          description: "Replacement domains associated with the server, separated\
            \ by spaces."
          example: example.com service.example.com
        awsRoles:
          type: array
          description: Replacement list of AWS roles.
          items:
            $ref: "#/components/schemas/AwsRole"
    ServerCreateResponse:
