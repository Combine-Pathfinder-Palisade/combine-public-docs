openapi: 3.1.0
info:
  title: Combine TAP API
  description: |-
    The Combine TAP API manages users, servers, groups, AWS role assignments, certificates, alert events, configuration, metadata, and operational tools for a Combine deployment. The CAP- and SCAP-compatible endpoints that issue temporary AWS credentials are documented separately in the [CAP / SCAP API](/cap-scap-api/cap-scap-api) section.

    All requests must use HTTPS, except the health check and the OCSP responder, which are also served over HTTP. Except where explicitly noted, requests require mutual TLS with a valid client certificate issued for the deployment. There is no login step: the certificate's serial number identifies the caller's user account, and that account's role (user, admin, or super_admin) determines what the caller can access. A request over plain HTTP, without a valid client certificate, with a revoked certificate, or for an unknown or inactive account receives the Combine HTML error page, with HTTP status 200, instead of a JSON response.

    The Users and Servers endpoints are available in two versions. Version `v1` (`/tap/api/v1/users` and `/tap/api/v1/servers`) returns every user or server in full from the list endpoints and returns a presigned download link in `bundlePath`. Version `v2` (`/tap/api/v2/users` and `/tap/api/v2/servers`) returns a summary of each user or server from the list endpoints, with optional paging and search, and returns the stored location of the certificate bundle in `bundlePath`. Every other endpoint uses `/tap/api/v1`.

    Responses of at least 1,024 bytes, or of unknown length, with a JSON, plain text, HTML, CSS, or JavaScript content type are compressed with gzip when the request sends `Accept-Encoding: gzip`.

    Requests that modify data must include the X-Requested-By header; this applies to every method except GET and HEAD. A request that omits it is rejected with 400 and an empty body. Administrative operations require an account with the admin role; the super_admin role satisfies every role check. A caller without the required role receives 403, except on `POST /tap/api/v1/admin/certificate/custom`, which returns 500.

    For a step-by-step guide with curl and Python examples, see [Call the TAP API](/Combine-AWS/tutorials/development/how-to-call-the-tap-api).
  version: "3.14.9.4"
servers:
  - url: "https://{host}"
    description: Base URL for a shard's TAP API.
    variables:
      host:
        description: External TAP load balancer DNS name for the shard.
        default: tap.example.com
security:
  - mutualTLS: []
tags:
  - name: Users
    description: Manage user accounts and their credential bundles.
  - name: Servers
    description: Manage server accounts and their certificates.
  - name: Groups
    description: Manage groups and their memberships.
  - name: AWS Roles
    description: Manage the AWS roles available for assignment.
  - name: AWS Console
    description: Sign in to the AWS console with an assigned AWS role.
  - name: Certificates
    description: Sign certificates and check certificate status.
  - name: Alert Events
    description: View and manage security alert events.
  - name: Configuration
    description: View and update the application configuration.
  - name: Administration
    description: Administrative operations such as sending mass email and rebuilding
      credential bundles.
  - name: Metadata
    description: "Application metadata, reference data, and deployment information."
  - name: Documentation
    description: "Reference lookups for supported instance types, versions, and endpoints."
  - name: Tools
    description: "Utilities such as CloudFormation template analysis, workload health,\
      \ and firewall rules."
  - name: System
    description: Service health checks.
paths:
  /tap/api/v1/alerts/events:
    get:
      tags:
        - Alert Events
      summary: List alert events
      description: "Returns alert events, most recently seen first, optionally filtered
        by date range, summary text, and ignored state. Available to any authenticated
        user."
      operationId: getAlertEvents
      parameters:
        - name: dateStart
          in: query
          description: "Inclusive lower bound on the time the event was last seen, in
            epoch seconds. Compared as a string, so send the same number of digits as
            stored timestamps (10 for current dates)."
          schema:
            type: string
            default: ""
        - name: dateEnd
          in: query
          description: "Inclusive upper bound on the time the event was last seen, in
            epoch seconds. Compared as a string, like dateStart."
          schema:
            type: string
            default: ""
        - name: summary
          in: query
          description: "Intended to match a substring of the event summary. In this
            release the filter is applied to an attribute that stored alert events do
            not have, so any non-empty value returns an empty list."
          schema:
            type: string
            default: ""
        - name: showIgnored
          in: query
          description: "When \"true\" (ignoring case and surrounding whitespace), include
            ignored events; otherwise only open events are returned."
          schema:
            type: string
            default: ""
      responses:
        "200":
          description: Matching alert events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertEventListResponse"
    delete:
      tags:
        - Alert Events
      summary: Delete all alert events
      description: Permanently deletes every alert event. Requires the admin role.
      operationId: deleteAlertEvents
      security:
        - mutualTLS: []
          xRequestedBy: []
      responses:
        "200":
          description: All alert events were deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "403":
          description: The caller does not have the admin role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The alert events could not be deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tap/api/v1/alerts/events/export:
    get:
      tags:
        - Alert Events
      summary: Export all alert events
      description: "Returns every alert event, open and ignored, as a downloadable
        JSON attachment (a bare array, not wrapped in data). Available to any authenticated
        user."
      operationId: exportAlertEvents
      responses:
        "200":
          description: JSON attachment containing all alert events.
          headers:
            Content-Disposition:
              description: Always attachment; filename="events.json".
              style: simple
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AlertEvent"
  /tap/api/v1/alerts/events/{id}:
    get:
      tags:
        - Alert Events
      summary: Get an alert event
      description: Returns a single alert event by its identifier. Available to any
        authenticated user.
      operationId: getAlertEvent
      parameters:
        - name: id
          in: path
          description: Identifier of the alert event.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The requested alert event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertEventResponse"
        "404":
          description: No alert event exists with the given identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The alert event could not be retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
        - Alert Events
      summary: Reopen an alert event
      description: Sets the state of the given alert event to "open". Available to
        any authenticated user.
      operationId: openAlertEvent
      security:
        - mutualTLS: []
          xRequestedBy: []
      parameters:
        - name: id
          in: path
          description: Identifier of the alert event.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The alert event was reopened.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          description: No alert event exists with the given identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The alert event could not be reopened.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
        - Alert Events
      summary: Ignore an alert event
      description: Sets the state of the given alert event to "ignored". Available
        to any authenticated user.
      operationId: ignoreAlertEvent
      security:
        - mutualTLS: []
          xRequestedBy: []
      parameters:
        - name: id
          in: path
          description: Identifier of the alert event.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The alert event was ignored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          description: No alert event exists with the given identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The alert event could not be ignored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tap/api/v1/login:
    get:
      tags:
        - AWS Console
      summary: Log in to the AWS console
      description: Redirects to an AWS console federated sign-in URL for the assumed
        role. Authenticated with a client certificate. The caller may sign in only
        with roles assigned to them.
      operationId: login
      parameters:
        - name: environment
          in: query
          description: "Identifier of the cloud partition the role belongs to, such\
            \ as AWS_C2S, AWS_SC2S, or AWS_GOV_CLOUD."
          required: true
          schema:
            type: string
        - name: agency
          in: query
          description: "Agency name of the AWS role (its agency valueAlias). Matched
            exactly (case-sensitive)."
          required: true
          schema:
            type: string
        - name: account
          in: query
          description: "Account (mission) name of the AWS role (its account valueAlias),
            not the account number. Matched exactly (case-sensitive)."
          required: true
          schema:
            type: string
        - name: role
          in: query
          description: "Role name of the AWS role (its role valueAlias). The IAM role
            that is assumed is the role value, which can differ. Matched exactly (case-sensitive)."
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "The sign-in could not be completed: a parameter is missing,
            no AWS role matches, the role is not assigned to the caller, or the role
            could not be assumed. The Combine HTML error page is returned with status
            200 and the message \"Could not sign in to the AWS Console. Please contact
            your Combine Administrator.\""
          content:
            text/html:
              schema:
                type: string
        "307":
          description: Redirect to the AWS console federated sign-in URL.
          headers:
            Location:
              description: "AWS federated sign-in URL for the console of the Region
                Combine is deployed in."
              style: simple
              schema:
                type: string
                format: uri
  /tap/api/v1/login/credentials:
    get:
      tags:
        - AWS Console
      summary: Get AWS console login credentials
      description: Returns temporary AWS credentials for the dashboard login flow.
        Authenticated with a client certificate. Credentials are issued only for roles
        assigned to the caller.
      operationId: loginCredentials
      parameters:
        - name: environment
          in: query
          description: "Identifier of the cloud partition the role belongs to, such\
            \ as AWS_C2S, AWS_SC2S, or AWS_GOV_CLOUD."
          required: true
          schema:
            type: string
        - name: agency
          in: query
          description: "Agency name of the AWS role (its agency valueAlias). Matched
            exactly (case-sensitive)."
          required: true
          schema:
            type: string
        - name: account
          in: query
          description: "Account (mission) name of the AWS role (its account valueAlias),
            not the account number. Matched exactly (case-sensitive)."
          required: true
          schema:
            type: string
        - name: role
          in: query
          description: "Role name of the AWS role (its role valueAlias). The IAM role
            that is assumed is the role value, which can differ. Matched exactly (case-sensitive)."
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The temporary credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialsResponse"
        "500":
          description: "The credentials could not be issued: a parameter is missing,
            no AWS role matches, the role is not assigned to the caller, or the role
            could not be assumed. The Combine HTML error page is returned."
          content:
            text/html:
              schema:
                type: string
  /combine/api/health:
    get:
      tags:
        - System
      summary: Check service health
      description: Returns a successful response when the service is available.
      operationId: healthCheck
      security: []
      responses:
        "200":
          description: The service is available.
  /tap/api/v1/admin/bundle:
    post:
      tags:
        - Administration
      summary: Rebuild all credential bundles
      description: Rebuilds the certificate bundles for every user and server. Requires
        the admin role.
      operationId: rebuildAllBundles
      security:
        - mutualTLS: []
          xRequestedBy: []
      responses:
        "200":
          description: The bundles were rebuilt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "403":
          description: The caller does not have the admin role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The bundles could not be rebuilt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tap/api/v1/admin/email:
    put:
      tags:
        - Administration
      summary: Send a mass email
      description: "Sends an email to the selected accounts as Bcc recipients, in batches
        of up to 32 recipients per message by default. Requires the admin role."
      operationId: sendMassEmail
      security:
        - mutualTLS: []
          xRequestedBy: []
      requestBody:
        description: The recipients and content of the email.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MassEmailRequest"
        required: true
      responses:
        "200":
          description: "The email was sent to all, or some, of the recipients. The\
            \ message reports how many were sent."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "403":
          description: The caller does not have the admin role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email integration is not enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "The email could not be sent to any recipient, or the request
            body is missing a field or is not valid JSON."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tap/api/v1/aws-roles:
    get:
      tags:
        - AWS Roles
      summary: List AWS roles
      description: Returns all AWS roles. Available to any authenticated caller.
      operationId: all
      responses:
        "200":
          description: A list of AWS roles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AwsRoleListResponse"
    post:
      tags:
        - AWS Roles
      summary: Create an AWS role
      description: Creates an AWS role. Requires the admin role.
      operationId: createRole
      security:
        - mutualTLS: []
          xRequestedBy: []
      requestBody:
        description: The role to create.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AwsRoleRequest"
        required: true
      responses:
        "200":
          description: The created AWS role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AwsRoleResponse"
        "400":
          description: "The environment is missing or is not an emulated AWS partition;
            the account, agency, or role is null or has a blank value or valueAlias;
            another role in the same environment has the same account valueAlias and
            role valueAlias (ignoring case); or the role could not be saved, including
            when the request body is malformed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller does not have the admin role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tap/api/v1/aws-roles/{roleId}:
    get:
      tags:
        - AWS Roles
      summary: Get an AWS role
      description: Returns a single AWS role by its identifier. Requires the admin
        role.
      operationId: getRole
      parameters:
        - name: roleId
          in: path
          description: Identifier of the role.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The requested AWS role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AwsRoleResponse"
        "403":
          description: The caller does not have the admin role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "No role exists with the given identifier, or the identifier\
            \ is not a number."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
        - AWS Roles
      summary: Update an AWS role
      description: "Updates an AWS role and replaces the copy of the role stored on
        every user and server that holds it. The environment, account, and role values
        must always be provided; an omitted agency is reset to Combine, and defaultRole
        is changed only when present. Each of account, agency, and role is replaced
        as a whole, so an omitted valueDescription becomes empty. An id in the request
        body is ignored. Requires the admin role."
      operationId: updateRole
      security:
        - mutualTLS: []
          xRequestedBy: []
      parameters:
        - name: roleId
          in: path
          description: Identifier of the role.
          required: true
          schema:
            type: string
      requestBody:
        description: The role values to apply.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AwsRoleRequest"
        required: true
      responses:
        "200":
          description: The updated AWS role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AwsRoleResponse"
        "400":
          description: "The environment is missing or is not an emulated AWS partition;
            the account, agency, or role is null or has a blank value or valueAlias;
            or another role in the same environment has the same account valueAlias
            and role valueAlias (ignoring case)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller does not have the admin role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "The role could not be updated, including when the identifier
            is not a number, no role exists with the given identifier, or the request
            body is malformed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
        - AWS Roles
      summary: Delete an AWS role
      description: Deletes an AWS role and removes it from any users and servers that
        hold it. Requires the admin role.
      operationId: deleteRole
      security:
        - mutualTLS: []
          xRequestedBy: []
      parameters:
        - name: roleId
          in: path
          description: Identifier of the role.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The role was deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AwsRoleDeleteResponse"
        "403":
          description: The caller does not have the admin role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No role exists with the given identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "The identifier is not a number, the role could not be removed
            from its users and servers, or the role could not be deleted."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tap/api/v1/admin/certificate/custom:
    post:
      tags:
        - Certificates
      summary: Sign a custom certificate signing request
      description: Signs a PEM-encoded PKCS#10 certificate signing request and returns
        the signed certificate. Requires the admin role. Requires custom CSR signing
        to be enabled. A caller without the admin role, or a deployment where custom
        CSR signing is not enabled, receives 500 with the Combine HTML error page.
      operationId: signCustomCsrRequest
      security:
        - mutualTLS: []
          xRequestedBy: []
      requestBody:
        description: The PEM-encoded PKCS#10 certificate signing request.
        content:
          text/plain:
            schema:
              type: string
              example: |-
                -----BEGIN CERTIFICATE REQUEST-----
                ...
                -----END CERTIFICATE REQUEST-----
        required: true
      responses:
        "200":
          description: The signed certificate in PEM format.
          content:
            text/plain:
              schema:
                type: string
                example: |-
                  -----BEGIN CERTIFICATE-----
                  ...
                  -----END CERTIFICATE-----
        "400":
          description: The request body is not a PEM-encoded certificate signing request.
          content:
            text/plain:
              schema:
                type: string
                example: Request was not a PEM Encoded CSR!
        "413":
          description: "The request body is longer than the combine.tap.api.certificates.signCustomCSR.byteLimit
            Configuration Value (default 65,536 characters)."
          content:
            text/plain:
              schema:
                type: string
                example: "The CSR exceeds the maximum supported size of [65536] bytes!"
        "500":
          description: "The certificate signing request could not be signed (plain text),
            or the caller does not have the admin role or custom CSR signing is not enabled
            (the Combine HTML error page)."
          content:
            text/plain:
              schema:
                type: string
                example: Could not sign custom CSR Request. See Error Log.
            text/html:
              schema:
                type: string
  /tap/api/v1/config/application:
    get:
      tags:
        - Configuration
      summary: Get the application configuration
      description: Returns the application configuration. Available to any authenticated
        user.
      operationId: getApplicationConfiguration
      responses:
        "200":
          description: The application configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationConfigurationResponse"
        "500":
          description: The application configuration could not be retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
        - Configuration
      summary: Update the application configuration
      description: "Updates the application configuration. Only these fields are\
        \ written: customerName, userLimit, userValidateEmailDomain, userValidateEmailDomainWhitelist,\
        \ sendWelcomeEmail, sendWelcomeEmailWithAttachment, showBundleLinks, enableResourceRoleMasquerade,\
        \ enableAwsApiLogging, enableOCSP, certificateKeySize, certificateHashAlgorithm,\
        \ and the cors fields. Omitted or null fields are left unchanged, except userValidateEmailDomainWhitelist:\
        \ when it is empty or null, or omitted while no domains are allowed, the deployment's\
        \ default allowed domains are written. userValidateEmailDomainWhitelist, corsAccessControlAllowOrigin,\
        \ and corsAccessControlAllowMethods are split on commas, semicolons, spaces,\
        \ and newlines, de-duplicated, and stored separated by spaces. Requires the\
        \ admin role."
      operationId: updateApplicationConfiguration
      security:
        - mutualTLS: []
          xRequestedBy: []
      requestBody:
        description: The application configuration to apply.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationConfiguration"
        required: true
      responses:
        "200":
          description: The updated application configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationConfigurationUpdateResponse"
        "403":
          description: The user is not authorized to update the application configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The application configuration could not be updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tap/api/v1/config/application/email-integration:
    get:
      tags:
        - Configuration
      summary: Get the email integration status
      description: Returns whether email integration is enabled. Available to any
        authenticated user.
      operationId: getEmailIntegrationFlag
      responses:
        "200":
          description: Whether email integration is enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailIntegrationResponse"
        "500":
          description: The email integration status could not be retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tap/api/v1/config/application/item:
    put:
      tags:
        - Configuration
      summary: Update an application configuration item
      description: Writes a single configuration value by name. Any configuration value
        name is accepted. Requires the admin role.
      operationId: updateApplicationConfigurationItem
      security:
        - mutualTLS: []
          xRequestedBy: []
      requestBody:
        description: The configuration item to set.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigurationItemRequest"
        required: true
      responses:
        "200":
          description: The configuration item was updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "403":
          description: The user is not authorized to update the application configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The configuration item could not be updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tap/api/v1/partitions/getActivePartitions:
    get:
      tags:
        - Configuration
      summary: List active partitions
      description: "Returns the cloud partitions that are active in this deployment,\
        \ in the order listed by the combine.partitions.active configuration value.\
        \ Returns an empty array when no partition is active. Available to any authenticated\
        \ user."
      operationId: getActivePartitions
      responses:
        "200":
          description: The active cloud partitions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Partition"
  /tap/api/v1/partitions/getPartitions:
    get:
      tags:
        - Configuration
      summary: List partitions
      description: "Returns every emulated AWS partition defined for the deployment,
        in no guaranteed order. Available to any authenticated user."
      operationId: getPartitions
      responses:
        "200":
          description: The available cloud partitions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Partition"
  /tap/api/v1/admin/metadata:
    get:
      tags:
        - Metadata
      summary: Get dashboard metadata
      description: Returns metadata for the administrator dashboard. Requires the
        admin role.
      operationId: getDashboardMetadata
      responses:
        "200":
          description: The dashboard metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardMetadataResponse"
        "403":
          description: The user is not authorized to access dashboard metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The dashboard metadata could not be retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tap/api/v1/certificate/certificate-expiration-date:
    get:
      tags:
        - Certificates
      summary: Get certificate authority expiration dates
      description: Returns the expiration dates of the signer and root certificate
        authority certificates. Available to any authenticated user.
      operationId: getCertificateExpirationDates
      responses:
        "200":
          description: The certificate authority expiration dates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateExpirationResponse"
  /tap/api/v1/certificate/ocsp:
    post:
      tags:
        - Certificates
      summary: Process an OCSP request
      description: Checks the revocation status of the certificates in a DER-encoded
        OCSP request and returns a signed OCSP response. Requires the OCSP responder
        to be enabled. Does not require a client certificate or the X-Requested-By
        header. A request larger than the combine.tap.ocsp.responder.request.byteLimit
        Configuration Value (default 8,192 bytes) receives an OCSP malformedRequest
        response, even when the responder is not enabled. A certificate not issued
        by the deployment's signer certificate authority is reported as unknown.
      operationId: handleRequest
      security: []
      requestBody:
        description: The DER-encoded OCSP request.
        content:
          application/ocsp-request:
            schema:
              format: binary
        required: true
      responses:
        "200":
          description: "The signed OCSP response, or an OCSP malformedRequest response
            when the request is too large."
          content:
            application/ocsp-response:
              schema:
                format: binary
        "404":
          description: The OCSP responder is not enabled.
        "500":
          description: The OCSP request could not be processed.
  /tap/api/v1/certificate/ocsp/{request}:
    get:
      tags:
        - Certificates
      summary: Process an OCSP request (GET)
      description: "The RFC 6960 GET form of the OCSP responder. Checks the revocation\
        \ status of the certificates in the OCSP request carried in the rest of the\
        \ path and returns a signed OCSP response. Requires the OCSP responder to be\
        \ enabled. Does not require a client certificate. A request that cannot be\
        \ decoded receives an OCSP malformedRequest response, even when the responder\
        \ is not enabled."
      operationId: handleRequestEncoded
      security: []
      parameters:
        - name: request
          in: path
          description: "The DER-encoded OCSP request, encoded with standard Base64 and
            then URL-encoded. It occupies the rest of the path and may contain unescaped
            / characters."
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "The signed OCSP response, or an OCSP malformedRequest response\
            \ when the request could not be decoded."
          content:
            application/ocsp-response:
              schema:
                format: binary
        "404":
          description: The OCSP responder is not enabled.
        "500":
          description: The OCSP request could not be processed.
  /tap/api/v1/documentation/service-endpoints:
    get:
      tags:
        - Documentation
      summary: List service endpoints
      description: "Returns the hostname of each supported service endpoint in each
        region, keyed by region ID and then by the endpoint's display name (for example
        EC2 or S3 Control). Covers every AWS partition defined for the deployment,
        emulated or not, so a host partition region such as us-east-1 appears with
        an empty object."
      operationId: getAllServiceEndpoints
      responses:
        "200":
          description: "Endpoint hostnames keyed by region ID, then by endpoint display
            name."
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    type: string
                    example: ec2.us-iso-east-1.c2s.ic.gov
  /tap/api/v1/documentation/supported-vpce-service-names:
    get:
      tags:
        - Documentation
      summary: List supported VPC endpoint service names
      description: "Returns the supported VPC endpoint service names for each region
        of each emulated environment. Each * in a configured name is replaced by the
        region ID."
      operationId: getAllServiceNames
      responses:
        "200":
          description: The supported VPC endpoint service names.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupportedServiceNames"
  /tap/api/v1/documentation/supported-instance-types:
    get:
      tags:
        - Documentation
      summary: List supported instance types
      description: "Returns the supported instance types for EC2, ElastiCache, RDS,
        and EMR in each emulated environment, grouped by instance family. A service
        and environment with no instance type list configured for the environment
        is omitted, so the array can be empty."
      operationId: getAllSupportedInstanceTypes
      responses:
        "200":
          description: The supported instance types.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupportedInstanceTypes"
  /tap/api/v1/documentation/supported-eks-cluster-versions:
    get:
      tags:
        - Documentation
      summary: List supported EKS cluster versions
      description: "Returns the supported EKS cluster versions for each AWS partition
        defined for the deployment, emulated or not. The host partition (AWS) has an
        empty list."
      operationId: getEksClusterVersions
      responses:
        "200":
          description: The supported EKS cluster versions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupportedEksClusterVersions"
  /tap/api/v1/documentation/supported-rds-engine-versions:
    get:
      tags:
        - Documentation
      summary: List supported RDS engine versions
      description: Returns the supported RDS engine versions for each engine in each
        environment.
      operationId: getRdsEngineVersions
      responses:
        "200":
          description: The supported RDS engine versions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupportedRdsEngineVersions"
  /tap/api/v1/groups:
    get:
      tags:
        - Groups
      summary: List all groups
      description: "Returns every group, sorted by name (ignoring case). Requires the
        admin role."
      operationId: getAllGroups
      responses:
        "200":
          description: All groups.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupListResponse"
        "403":
          description: The caller does not have the admin role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - Groups
      summary: Create a group
      description: Creates a new group. Requires the admin role.
      operationId: createGroup
      security:
        - mutualTLS: []
          xRequestedBy: []
      requestBody:
        description: Group to create.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupCreateRequest"
        required: true
      responses:
        "200":
          description: The created group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupResponse"
        "400":
          description: The group name is missing or blank.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller does not have the admin role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "The group could not be created, including when the request
            body is not a JSON object or a field has the wrong type."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tap/api/v1/groups/{groupId}:
    get:
      tags:
        - Groups
      summary: Get a group
      description: Returns a single group by its identifier. Requires the admin role.
      operationId: getGroup
      parameters:
        - name: groupId
          in: path
          description: Identifier of the group.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The requested group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupResponse"
        "403":
          description: The caller does not have the admin role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No group exists with the given identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
        - Groups
      summary: Update a group
      description: Updates a group. Only the fields present in the request body are
        changed. Requires the admin role.
      operationId: updateGroup
      security:
        - mutualTLS: []
          xRequestedBy: []
      parameters:
        - name: groupId
          in: path
          description: Identifier of the group.
          required: true
          schema:
            type: string
      requestBody:
        description: Fields to change; omitted fields are left unchanged.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupUpdateRequest"
        required: true
      responses:
        "200":
          description: The updated group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupResponse"
        "400":
          description: The group name was provided but empty.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller does not have the admin role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No group exists with the given identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "The group could not be updated, including when the request
            body is not a JSON object or a field has the wrong type."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
        - Groups
      summary: Delete a group
      description: Deletes a group and all of its memberships. Requires the admin
        role.
      operationId: deleteGroup
      security:
        - mutualTLS: []
          xRequestedBy: []
      parameters:
        - name: groupId
          in: path
          description: Identifier of the group.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The group was deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "403":
          description: The caller does not have the admin role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No group exists with the given identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The group could not be deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tap/api/v1/groups/{groupId}/members:
    get:
      tags:
        - Groups
      summary: List group members
      description: "Returns the members of a group. Requires the admin role. Members\
        \ with the super_admin role are included only for a super_admin caller."
      operationId: getMembers
      parameters:
        - name: groupId
          in: path
          description: Identifier of the group.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The group's members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupMembershipListResponse"
        "403":
          description: The caller does not have the admin role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No group exists with the given identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - Groups
      summary: Add members to a group
      description: "Adds one or more users to a group. Every ID is checked before
        any membership is written, so a 400, 403, or 404 response adds no one. Users
        already in the group are skipped. Each membership stores a copy of the user's
        fullName, email, and userRole. Requires the admin role."
      operationId: addMembers
      security:
        - mutualTLS: []
          xRequestedBy: []
      parameters:
        - name: groupId
          in: path
          description: Identifier of the group.
          required: true
          schema:
            type: string
      requestBody:
        description: "Users to add, specified as userId or userIds."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMembersRequest"
        required: true
      responses:
        "200":
          description: The memberships that were created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddMembersResponse"
        "400":
          description: The request body is missing user IDs or contains an invalid
            ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "The caller does not have the admin role, or one of the users\
            \ is a super_admin and the caller is not."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The group or one of the users was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "The request body is malformed: not a JSON object, userId is
            null, or userIds is not an array of IDs. A membership that cannot be saved
            is left out of data instead of causing an error."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tap/api/v1/groups/{groupId}/members/{userId}:
    delete:
      tags:
        - Groups
      summary: Remove a member from a group
      description: Removes a user from a group. Requires the admin role.
      operationId: removeMember
      security:
        - mutualTLS: []
          xRequestedBy: []
      parameters:
        - name: groupId
          in: path
          description: Identifier of the group.
          required: true
          schema:
            type: string
        - name: userId
          in: path
          description: Identifier of the user to remove.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The member was removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "403":
          description: "The caller does not have the admin role, or the user is a super_admin\
            \ and the caller is not."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The group was not found or the user is not a member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The member could not be removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tap/api/v1/groups/user/{userId}:
    get:
      tags:
        - Groups
      summary: List a user's groups
      description: "Returns the groups a user belongs to, sorted by name (ignoring
        case). An unknown user ID returns an empty list. Allowed for an admin or the
        user themselves."
      operationId: getGroupsForUser
      parameters:
        - name: userId
          in: path
          description: Identifier of the user.
          required: true
