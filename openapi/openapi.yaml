          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller does not have the admin role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The firewall rules tool is not enabled, or no Combine firewall
            override rule group is configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: More than one Combine firewall override rule group was found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The firewall rules could not be updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tap/api/v1/tools/workload-health:
    get:
      tags:
        - Tools
      summary: Get the workload health configuration
      description: Returns the configured workload health dashboard and its markup.
      operationId: viewworkloadHealth
