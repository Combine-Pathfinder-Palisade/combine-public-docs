          in: query
          description: "When true, returns only active users that count toward the user\
            \ limit (super_admin users never count)."
          schema:
            type: boolean
        - name: includeCounts
          in: query
          description: "When true, the response also includes userCount and userCountActive.
            This also selects a single page."
          schema:
            type: boolean
      responses:
        "200":
          description: All users or a single page of users.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "400":
          description: "A paging parameter is invalid: pageSize or page is not a whole\
            \ number, pageSize is outside 1 to 100, page is negative, q is longer than\
            \ 200 characters, or nextToken is malformed or was issued for a different q\
            \ or active value."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller has neither the admin nor the user role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - Users
      summary: Create a user (v2)
      description: "Creates a user, issues the user's certificate, and builds the certificate
        bundle. Requires the admin role. The default AWS roles are assigned when awsRoles
        is omitted or empty. When the sendWelcomeEmail setting is on and email integration
        is enabled, the user is sent a welcome email; it includes a download link valid
        for up to 8 hours when the showBundleLinks setting is on, and attaches the bundle
        when the sendWelcomeEmailWithAttachment setting is on. If the download link cannot
        be generated, the user is still created but no email is sent, and POST /tap/api/v2/users/{userId}/resend
        can send it later. bundlePath in the response is the stored location of the certificate bundle, not a download link."
      operationId: createUserV2
      security:
        - mutualTLS: []
          xRequestedBy: []
      requestBody:
        description: User to create.
        content:
