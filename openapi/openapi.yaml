      security:
        - mutualTLS: []
          xRequestedBy: []
      requestBody:
        description: The workload health configuration to set.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkloadHealthUpdateRequest"
        required: true
      responses:
        "200":
          description: The workload health configuration was updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "403":
          description: The caller does not have the admin role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The workload health tool is not enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
