          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The CloudFormation template analysis tool is not enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: "The template exceeds the maximum size, set by the combine.tap.tools.analyzeCloudFormationTemplate.byteLimit
