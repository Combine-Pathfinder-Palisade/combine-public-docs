openapi: 3.1.0
info:
  title: Combine TAP API
  description: |-
    The Combine TAP API manages users, servers, groups, AWS role assignments, certificates, alert events, configuration, metadata, and operational tools for a Combine deployment. It also provides CAP and SCAP-compatible endpoints for issuing temporary AWS credentials.

    All requests must use HTTPS. Except where explicitly noted, requests require mutual TLS with a valid client certificate issued for the deployment. Requests that modify data must include the X-Requested-By header; this applies to all methods except GET, HEAD, and OPTIONS. Administrative operations require an account with the admin role.
  version: "3.15"
servers:
  - url: "https://{host}"
    description: Base URL for a shard's TAP API.
    variables:
      host:
        description: External TAP load balancer DNS name for the shard.
        default: tap.example.com
security:
  - mutualTLS: []
tags:
  - name: Users
    description: Manage user accounts and their credential bundles.
  - name: Servers
    description: Manage server accounts and their certificates.
  - name: Groups
    description: Manage groups and their memberships.
  - name: AWS Roles
    description: Manage the AWS roles available for assignment.
  - name: CAP / SCAP
    description: Issue temporary AWS credentials and list the accounts a caller may
      access.
  - name: Certificates
    description: Sign certificates and check certificate status.
  - name: Alert Events
    description: View and manage security alert events.
  - name: Configuration
    description: View and update the application configuration.
  - name: Administration
    description: Administrative operations such as sending mass email and rebuilding
      credential bundles.
  - name: Metadata
    description: "Application metadata, reference data, and deployment information."
  - name: Documentation
    description: "Reference lookups for supported instance types, versions, and endpoints."
  - name: Tools
    description: "Utilities such as CloudFormation template analysis, workload health,\
      \ and firewall rules."
  - name: System
    description: Service health checks.
paths:
  /tap/api/v1/alerts/events:
    get:
      tags:
        - Alert Events
      summary: List alert events
      description: "Returns alert events, optionally filtered by date range, summary\
        \ text, ignored state, and group."
      operationId: getAlertEvents
      parameters:
        - name: dateStart
          in: query
          description: "Inclusive lower bound for the event date, in epoch seconds."
          schema:
            type: string
            default: ""
        - name: dateEnd
          in: query
          description: "Inclusive upper bound for the event date, in epoch seconds."
          schema:
            type: string
            default: ""
        - name: summary
          in: query
          description: Case-sensitive substring to match against the event summary.
          schema:
            type: string
            default: ""
        - name: showIgnored
          in: query
          description: "When \"true\", include ignored events; otherwise only open events\
            \ are returned."
          schema:
            type: string
            default: ""
        - name: groupId
          in: query
          description: Restrict results to events matching the given group's account
            IDs and CIDR blocks.
          schema:
            type: string
            default: ""
      responses:
        "200":
          description: Matching alert events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertEventListResponse"
        "404":
          description: The requested group was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
        - Alert Events
      summary: Delete all alert events
      description: Permanently deletes every alert event. Requires the admin role.
      operationId: deleteAlertEvents
      responses:
        "200":
          description: All alert events were deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: The user is not authorized to perform this action.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The alert events could not be deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tap/api/v1/alerts/events/export:
    get:
      tags:
        - Alert Events
      summary: Export all alert events
      description: Returns every alert event as a downloadable JSON attachment.
      operationId: exportAlertEvents
      responses:
        "200":
          description: JSON attachment containing all alert events.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AlertEvent"
        "500":
          description: The export could not be generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tap/api/v1/alerts/events/{id}:
    get:
      tags:
        - Alert Events
      summary: Get an alert event
      description: Returns a single alert event by its identifier.
      operationId: getAlertEvent
      parameters:
        - name: id
          in: path
          description: Identifier of the alert event.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The requested alert event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertEventResponse"
        "404":
          description: No alert event exists with the given identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The alert event could not be retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
        - Alert Events
      summary: Reopen an alert event
      description: Sets the state of the given alert event to "open".
      operationId: openAlertEvent
      parameters:
        - name: id
          in: path
          description: Identifier of the alert event.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The alert event was reopened.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "500":
          description: The alert event could not be reopened.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
        - Alert Events
      summary: Ignore an alert event
      description: Sets the state of the given alert event to "ignored".
      operationId: ignoreAlertEvent
      parameters:
        - name: id
          in: path
          description: Identifier of the alert event.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The alert event was ignored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "500":
          description: The alert event could not be ignored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v2/user/accesslist:
    get:
      tags:
        - CAP / SCAP
      summary: List the caller's access
      description: "Returns the AWS accounts and roles the caller may access, grouped\
        \ by account. Authenticated with a client certificate. Requires the CAP API\
        \ to be enabled."
      operationId: getCredentialsList
      responses:
        "200":
          description: The caller's accessible accounts and roles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CapAccessListEntry"
        "500":
          description: The access list could not be retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapStatusResponse"
  /api/v1/credentials:
    get:
      tags:
        - CAP / SCAP
      summary: Get temporary AWS credentials
      description: Returns temporary AWS credentials for an assumed role. Authenticated
        with a client certificate. Credentials are issued only for roles assigned
        to the caller. Requires the CAP API to be enabled.
      operationId: getAccess
      parameters:
        - name: duration
          in: query
          description: Requested session duration in seconds. Must be between 900 and
            the configured maximum. Defaults to the configured value when omitted.
          schema:
            type: string
        - name: policy
          in: query
          description: Optional IAM policy that further restricts the session.
          schema:
            type: string
        - name: agency
          in: query
          description: Agency the account belongs to.
          required: true
          schema:
            type: string
        - name: mission
          in: query
          description: Mission the account belongs to.
          required: true
          schema:
            type: string
        - name: role
          in: query
          description: Name of the role to assume.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The temporary credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialsResponse"
        "400":
          description: A required parameter is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapStatusResponse"
        "403":
          description: The caller is not authorized to assume the requested role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapStatusResponse"
        "404":
          description: No role matches the requested parameters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapStatusResponse"
        "500":
          description: The credentials could not be issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapStatusResponse"
  /api/v1/accounts/{accountId}:
    get:
      tags:
        - CAP / SCAP
      summary: Echo the account identifier
      description: Returns a plain-text confirmation of the account identifier.
      operationId: base
      parameters:
        - name: accountId
          in: path
          description: AWS account number.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Confirmation of the account identifier.
          content:
            text/plain:
              schema:
                example: Account ID is 123456789012
  /api/v1/accounts/{accountId}/activity:
    get:
      tags:
        - CAP / SCAP
      summary: List account activity
      description: Returns a per-user summary of AWS access to the account. Requires
        the CAP API to be enabled.
      operationId: getActivity
      parameters:
        - name: accountId
          in: path
          description: AWS account number.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The account's access summary.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CapTrailSummary"
  /api/v1/accounts/{accountId}/trailevents:
    get:
      tags:
        - CAP / SCAP
      summary: List account trail events
      description: Returns a paginated list of AWS access trail events for the account.
        Requires the CAP API to be enabled.
      operationId: getTrailEvents
      parameters:
        - name: accountId
          in: path
          description: AWS account number.
          required: true
          schema:
            type: string
        - name: start_time
          in: query
          description: "Inclusive lower bound for the event time, as a UTC ISO8601 timestamp.\
            \ Defaults to 7 days before now when omitted."
          schema:
            type: string
        - name: stop_time
          in: query
          description: "Inclusive upper bound for the event time, as a UTC ISO8601 timestamp.\
            \ Defaults to now when omitted."
          schema:
            type: string
        - name: page
          in: query
          description: "Page number to return, starting at 1."
          schema:
            type: integer
            format: int32
            default: 1
        - name: page_size
          in: query
          description: "Number of events per page, between 10 and 500."
          schema:
            type: integer
            format: int32
            default: 100
        - name: sort
          in: query
          description: Sort order by event time. Either asc or desc.
          schema:
            type: string
            default: desc
      responses:
        "200":
          description: The matching trail events.
          headers:
            X-Returned-Rows:
              description: Number of events returned in this page.
              style: simple
              schema: {}
            X-Total-Rows:
              description: Total number of matching events.
              style: simple
              schema: {}
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CapTrailEvent"
        "400":
          description: A query parameter is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapStatusResponse"
  /cap/gxCAP/getAccessList:
    get:
      tags:
        - CAP / SCAP
      summary: List the caller's access
      description: "Returns the AWS accounts and roles the caller may access, grouped\
        \ by account. Authenticated with a client certificate. Requires the SCAP API\
        \ to be enabled."
      operationId: getCredentialsList_1
      responses:
        "200":
          description: The caller's accessible accounts and roles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScapAccessListResponse"
        "500":
          description: The access list could not be retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapStatusResponse"
  /cap/gxCAP/getTemporaryCredentials:
    get:
      tags:
        - CAP / SCAP
      summary: Get temporary AWS credentials
      description: Returns temporary AWS credentials for an assumed role. Authenticated
        with a client certificate. Credentials are issued only for roles assigned
        to the caller. Requires the SCAP API to be enabled.
      operationId: getTemporaryCredentials
      parameters:
        - name: duration
          in: query
          description: Requested session duration in seconds. Must be between 900 and
            the configured maximum. Defaults to the configured value when omitted.
          schema:
            type: string
        - name: policy
          in: query
          description: Optional IAM policy that further restricts the session.
          schema:
            type: string
        - name: agency
          in: query
          description: Agency the account belongs to.
          required: true
          schema:
            type: string
        - name: accountName
          in: query
          description: Name of the account.
          required: true
          schema:
            type: string
        - name: roleName
          in: query
          description: Name of the role to assume.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The temporary credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialsResponse"
        "400":
          description: A required parameter is missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapStatusResponse"
        "403":
          description: The caller is not authorized to assume the requested role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapStatusResponse"
        "404":
          description: "The agency, account, or role is not registered or is disabled."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapStatusResponse"
        "500":
          description: The credentials could not be issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapStatusResponse"
  /tap/api/v1/login:
    get:
      tags:
        - CAP / SCAP
      summary: Log in to the AWS console
      description: Redirects to an AWS console federated sign-in URL for the assumed
        role. Authenticated with a client certificate. The caller may sign in only
        with roles assigned to them.
      operationId: login
      parameters:
        - name: environment
          in: query
          description: Cloud environment the account belongs to.
          required: true
          schema:
            type: string
        - name: agency
          in: query
          description: Agency the account belongs to.
          required: true
          schema:
            type: string
        - name: account
          in: query
          description: Name of the account.
          required: true
          schema:
            type: string
        - name: role
          in: query
          description: Name of the role to assume.
          required: true
          schema:
            type: string
      responses:
        "307":
          description: Redirect to the AWS console federated sign-in URL.
          headers:
            Location:
              description: AWS console federated sign-in URL.
              style: simple
              schema: {}
        "500":
          description: The login could not be completed.
  /tap/api/v1/login/credentials:
    get:
      tags:
        - CAP / SCAP
      summary: Get AWS console login credentials
      description: Returns temporary AWS credentials for the dashboard login flow.
        Authenticated with a client certificate. Credentials are issued only for roles
        assigned to the caller.
      operationId: loginCredentials
      parameters:
        - name: environment
          in: query
          description: Cloud environment the account belongs to.
          required: true
          schema:
            type: string
        - name: agency
          in: query
          description: Agency the account belongs to.
          required: true
          schema:
            type: string
        - name: account
          in: query
          description: Name of the account.
          required: true
          schema:
            type: string
        - name: role
          in: query
          description: Name of the role to assume.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The temporary credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialsResponse"
        "500":
          description: The credentials could not be issued.
  /combine/api/health:
    get:
      tags:
        - System
      summary: Check service health
      description: Returns a successful response when the service is available.
      operationId: healthCheck
      responses:
        "200":
          description: The service is available.
  /tap/api/v1/admin/bundle:
    post:
      tags:
        - Administration
      summary: Rebuild all credential bundles
      description: Rebuilds the certificate bundles for every user and server. Requires
        the admin role.
      operationId: rebuildAllBundles
      requestBody:
        content:
          "*/*":
            schema:
              type: string
      responses:
        "200":
          description: The bundles were rebuilt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: The user is not authorized to rebuild credential bundles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The bundles could not be rebuilt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tap/api/v1/admin/{userId}/email:
    put:
      tags:
        - Administration
      summary: Send a mass email
      description: Sends an email to a selection of users. Requires the admin role.
      operationId: sendMassEmail
      parameters:
        - name: userId
          in: path
          description: Identifier of the user.
          required: true
          schema:
            type: string
      requestBody:
        description: The recipients and content of the email.
        content:
          "*/*":
            schema:
              $ref: "#/components/schemas/MassEmailRequest"
        required: true
      responses:
        "200":
          description: The email was sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Email integration is not enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: The user is not authorized to send a mass email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The email could not be sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tap/api/v1/aws-roles:
    get:
      tags:
        - AWS Roles
      summary: List AWS roles
      description: Returns all AWS roles.
      operationId: all
      responses:
        "200":
          description: A list of AWS roles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AwsRoleListResponse"
    post:
      tags:
        - AWS Roles
      summary: Create an AWS role
      description: Creates an AWS role. Requires the admin role.
      operationId: createRole
      requestBody:
        description: The role to create.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AwsRole"
        required: true
      responses:
        "200":
          description: The created AWS role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AwsRoleResponse"
        "400":
          description: "The role is missing a required value, has an invalid environment,\
            \ or already exists."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: The user is not authorized to access this resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tap/api/v1/aws-roles/{roleId}:
    get:
      tags:
        - AWS Roles
      summary: Get an AWS role
      description: Returns a single AWS role by its identifier. Requires the admin
        role.
      operationId: getRole
      parameters:
        - name: roleId
          in: path
          description: Identifier of the role.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The requested AWS role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AwsRoleResponse"
        "401":
          description: The user is not authorized to access this resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No role exists with the given identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
        - AWS Roles
      summary: Update an AWS role
      description: Updates an AWS role. Requires the admin role.
      operationId: updateRole
      parameters:
        - name: roleId
          in: path
          description: Identifier of the role.
          required: true
          schema:
            type: string
      requestBody:
        description: The role values to apply.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AwsRole"
        required: true
      responses:
        "200":
          description: The updated AWS role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AwsRoleResponse"
        "400":
          description: The role has an invalid value or already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: The user is not authorized to access this resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No role exists with the given identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
        - AWS Roles
      summary: Delete an AWS role
      description: Deletes an AWS role and removes it from any users and servers that
        hold it. Requires the admin role.
      operationId: deleteRole
      parameters:
        - name: roleId
          in: path
          description: Identifier of the role.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: string
      responses:
        "200":
          description: The role was deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AwsRoleDeleteResponse"
        "401":
          description: The user is not authorized to access this resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No role exists with the given identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tap/api/v1/admin/certificate/custom:
    post:
      tags:
        - Certificates
      summary: Sign a custom certificate signing request
      description: Signs a PEM-encoded PKCS#10 certificate signing request and returns
        the signed certificate. Requires the admin role. Requires custom CSR signing
        to be enabled.
      operationId: signCustomCsrRequest
      requestBody:
        description: The PEM-encoded PKCS#10 certificate signing request.
        content:
          text/plain:
            schema:
              example: |-
                -----BEGIN CERTIFICATE REQUEST-----
                ...
                -----END CERTIFICATE REQUEST-----
        required: true
      responses:
        "200":
          description: The signed certificate in PEM format.
          content:
            text/plain:
              schema:
                example: |-
                  -----BEGIN CERTIFICATE-----
                  ...
                  -----END CERTIFICATE-----
        "403":
          description: The user is not authorized to sign a custom certificate signing
            request.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The certificate signing request could not be signed.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tap/api/v1/config/application:
    get:
      tags:
        - Configuration
      summary: Get the application configuration
      description: Returns the application configuration.
      operationId: getApplicationConfiguration
      responses:
        "200":
          description: The application configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationConfigurationResponse"
        "500":
          description: The application configuration could not be retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
        - Configuration
      summary: Update the application configuration
      description: Updates the application configuration. Requires the admin role.
      operationId: updateApplicationConfiguration
      requestBody:
        description: The application configuration to apply.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationConfiguration"
        required: true
      responses:
        "200":
          description: The updated application configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationConfigurationUpdateResponse"
        "403":
          description: The user is not authorized to update the application configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
