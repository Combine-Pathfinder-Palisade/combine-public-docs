        commonName:
          type: string
          description: Common name to use in the user's certificate. Admin only.
        awsRoles:
          type: array
          description: Replacement list of AWS roles. Admin only.
          items:
            $ref: "#/components/schemas/AwsRole"
    UserCreateResponse:
      type: object
      description: The created user.
      properties:
        message:
          type: string
          description: Confirmation that the user was created.
          example: User created
        data:
          $ref: "#/components/schemas/User"
    UserCreateRequest:
      type: object
      description: Fields accepted when creating a user.
      properties:
        fullName:
          type: string
          description: Full name of the user.
          example: Jane Doe
        email:
          type: string
          description: Email address of the user.
          example: jane.doe@example.com
        userRole:
          type: string
          description: "Role assigned to the user. Defaults to user when omitted. Only\
            \ a super_admin may create a super_admin."
          enum:
            - user
            - admin
            - super_admin
          default: user
          example: user
        active:
          type: boolean
          description: Whether the user is active. Defaults to true when omitted.
          default: true
          example: true
        awsRoles:
          type: array
          description: AWS roles assigned to the user. Default roles are applied when
            omitted or empty.
          items:
            $ref: "#/components/schemas/AwsRole"
        commonName:
          type: string
