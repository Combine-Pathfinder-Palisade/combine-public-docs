        pageSize:
          type: integer
          format: int32
          description: The page size used. Present only for a paged response.
          example: 25
        nextToken:
          type: string
          description: "Token for the next page, sent back as nextToken. Present only\
            \ when more results remain."
        serverCount:
          type: integer
          format: int32
